      note: "与 p.13 的 BCS 斜率描述矛盾，但它是唯一能复现 Table 21-1 头胎两列的写法（model_audit §3.5）；暂不作开发起点，代码核对前与 Eq 2-1 并报（version_bundle_until_code_check，PUD-P2a-06/-08）"
