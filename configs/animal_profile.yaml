dry_matter_intake:
  value_ref: "withheld (public copy): Eq 2-1 (p.12) evaluated at the Table 21-1 (p.471) reference-cow inputs of configs/animal_profile.yaml fields.*; holder value in build_report.json"
  equation: "NASEM 2021 Eq 2-1（仅动物因素，p.12）"
  model_equivalent: "Eq 20-21（p.423）；印刷括号与 Eq 2-1 不一致，见 model_audit §3.3"
  equation_form: >-
    DMI = [3.7 + 5.7·Parity + 0.305·MilkE + 0.022·BW + (−0.689 − 1.87·Parity)·BCS]
          × [1 − (0.212 + 0.136·Parity)·exp(−0.053·DIM)]
  disambiguation_source: >-
    p.13 写明 BCS 每升 1 单位，头胎、经产 DMI 分别降 0.70、2.6 kg/d，
    与 (−0.689 − 1.87·Parity)·BCS 的写法一致（斜率 −0.689 / −2.559）。
  inputs:
    value_ref: "withheld (public copy): NASEM 2021 Table 21-1 (p.471) / Table 21-3 (p.473), reference-cow column 'Mature (700 kg)', DIM 200 -- read from a licensed copy; withheld (public copy): computed from the Table 21-1/21-3 (p.471-473) reference-cow inputs with the equations named in this block (Eq 2-1, Eq 3-13...3-20, Eq 7-1...7-8, Eq 20-373...20-389)"
    Parity: 1
    BW_kg: null
    BCS: 3.0
    DIM_d: null
    MilkE_Mcal_d: null
  milk_energy:
    value_ref: "withheld (public copy): computed from the Table 21-1/21-3 (p.471-473) reference-cow inputs with the equations named in this block (Eq 2-1, Eq 3-13...3-20, Eq 7-1...7-8, Eq 20-373...20-389)"
    equation: "Eq 3-14b（p.30）：NEL(Mcal/kg) = 9.29·脂肪 + 5.85·真蛋白 + 3.95·乳糖（均为 kg/kg）；模型式 Eq 20-218/20-221（p.441）"
    NEL_milk_Mcal_per_kg: null
    MilkE_Mcal_d: null
  computed_value_kg_d: null
  status: "derived_by_equation"
  role: >-
    固定情景 DMI：计划日粮总 DM 供给按此值设定，不随配方变化（数据可行性审计 §5.1）。
    这是“供给”而非实测采食；假定全部采食、无剩料，对所有方法一致（合同 §6.3、C04）。
  sensitivity_plus_minus_10pct_kg_d: [null, null]
  reference_values_not_used:
    - value: null
      source: "Table 21-1 Mature DIM 200（p.471）"
      note: "与本值差 ⟨withheld⟩%；用本画像输入无法复现，原因未定（model_audit §3.5）"
    - value: null
