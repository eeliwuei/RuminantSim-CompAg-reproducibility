  resolved_conflicts:
    hristov_2010_table6:
      history: "B-P2b-05 / B-113 / D-FIX-7：两份转录互相冲突，2026-09-24 按红队发现降为 blocked（原 lab_precision.hristov_2010.aNDF_commercial_labs_table6）"
      finding: >-
        对照缓存全文表 6（Commercial 行）逐格核对：两份转录都没有抄错，而是抄了不同的列。转录 A（数据可行性审计 §4.3/§11.4）取的是
        Adj SDr（调整到单次分析的实验室内重复性）与 SDLab；转录 B（S6§2.11）取的是 SDr（按报告的重复结果，平均约 1.8 次重复）、
        SDLab 与 Adj SDR（单次分析的再现性）。表 6 同时印有这 5 列（另有 2 列 mixed-model 估计），注 4 写明 Adj SDr 为“adjusted to a single
        analytical result”。旧配置 agreement 字段里“疑为列对应错误”的猜测不成立。
      use_rule: >-
        FIX5 2026-09-24 改写。TMR（MeasTMR，真实重复化验）：单次分析的实验室随机误差用 Adj SDr（lab_random，可随同一样品重复化验次数 k 缩小），实验室偏差用 SDLab（lab_bias）。原料 Youden 配对（FORAGE、GRAIN、PROTSUPP）：原文没有原料的重复化验结果，SDr/Adj SDr 由两种原料之差推出，含“实验室 × 原料”交互（按原料而异的实验室偏差），记为不可分的合并量 [lab_random, lab_bias]，整体不随 k 缩小；SDLab 只是两种原料共同的实验室主效应（粗饲料对的 GLM 估计为负、置 0，不代表粗饲料没有实验室偏差）。原料中可随 k 缩小的部分从表 6 分不出：主分析按保守处理（原料 Adj SDr 全部不随 k 缩小）；是否另设情景借用 MeasTMR 的 Adj SDr 近似可缩小部分，须用户或专家确认（use_rule_status）。SDr（按重复结果）与 Adj SDR 只作对照，不与前两者叠加。表 8（CP）的原料 Youden 配对同样处理
      use_rule_status: "pending_user_decision（用法待用户或专家确认；转录冲突本身已解决）"
      use_rule_superseded: "G3 原文：单次分析的实验室随机误差用 Adj SDr（HR10-T6-*-ADJSDR），实验室偏差用 SDLab（HR10-T6-*-SDLAB）；SDr（按重复结果）与 Adj SDR 只作对照，不与前两者叠加。FIX5 更正：该写法把原料 Youden 配对的 Adj SDr 当作可随 k 缩小的纯重复性，会高估重复化验与多送样的价值（验收 F07）"
      status_note: "转录冲突已按全文解决（verification = session_cache_fulltext_reverified，途径为会话缓存的出版社 HTML）；今日出版社页仍 403，建议用户在浏览器打开原文表 6 抽查一次后再关闭 B-113（见 reports/data_audit.md §12.1）。FIX5：B-113 只可关闭“转录冲突”一项；原料 Youden 配对的用法另立条目待用户或专家确认（见 use_rule_status）"
  usage_rules:
    - "〔FIX5 更正：原写“三分量可分解的只有青贮：SPW15-T3/T4 … 与 BB24A-T5”，BB24A-T5 的残差本身分不开采样与分析，与“三分量可分解”自相矛盾〕真实变异、采样、分析三者分开估计的只有 SPW15-T3（日项目：玉米青贮 DM、NDF、淀粉、灰分；haycrop 青贮 DM、NDF、CP、灰分）；SPW15-T4（月项目）只有场间 SD 与残差，月间真实分量由扣减表 3 的采样/分析方差得到（见下文第 5 条）；BB24A-T5 为真实分层（场、田块、窖、日）加“采样 + NIRS 分析”合并残差，采样与分析分不开；Cherney 2021 与 Turiello 2018 给采样端与实验室端的旁证。各研究采样误差相差数倍（玉米青贮 DM 的采样 + 分析：TU18-T4-CS-DM-RESID 对 SPW15-T3 的采样与分析合成），只能按情景区间使用（数据可行性审计 §4.1）"
    - "精料（SPW15-T6/T7/T8）只有场间 SD 与场内残差；残差 = 真实月间 + 采样 + 分析，分不开，只能作观测误差的上界；下界取实验室精度（HR10、AOAC）。区间式 EVSI（数据可行性审计 §0 Q2-6）"
    - "实验室偏差（component 含 lab_bias）在同一实验室多送样时平均不掉，不随 n、k 缩小；重复化验只缩小 lab_random（合同 T7.5）"
    - "HR10-T7 为单次结果总 SD（重复性 + 实验室间偏差），不得当作不可消除的实验室偏差，否则 EVSI 下限被高估 2–3 倍以上（数据可行性审计 §4.3）"
    - "SPW15-T4-*-MONTH 由残差扣减表 3 的采样/分析方差得到，隐含两项目误差相同（研究实验室 vs 商业实验室），可能高估月间真实方差与 EVSI"
    - "双计数：NASEM 表 SD 与这些研究的“场内残差”都已含采样与分析误差；生成真实 θ 时只能用 batch_true 分量，再叠加 sampling / lab_random / lab_bias（uncertainty.yaml DC-01…DC-05；验收 F06）"
    - "Hristov 与 Cherney 的数值为 65 °C 烘干后按收样基础或湿化学实验室端误差，用于 %DM 情景时须写明近似〔FIX5：Hall 2015 为收样基础，Mertens 2002、Thiex 2002/2003 摘要未写基础，同样只作近似〕"
    - "FIX5：Hristov 原料 Youden 配对（HR10-T6/T8 的 FORAGE、GRAIN、PROTSUPP）的 SDr/Adj SDr 是 [lab_random, lab_bias] 合并量，整体不随重复化验次数 k 缩小；只有 MeasTMR 的真实重复化验可作 lab_random（resolved_conflicts.hristov_2010_table6.use_rule；验收 F07）"
    - "FIX5：Cherney 表 3 的分样 CV 含烘干前分样误差，不随同一磨样重复化验次数 k 缩小；表 4 的 SD 含约 1/4 的分样 + 化验方差（CH21-T3/T4 的 fix5_note）"
    - "FIX5：NDF 口径不同（analyte_definition：SPW 日项目、Hristov、Cherney 为 aNDF；BB2024a 与 Mertens 2002 为 aNDFom；SPW 月项目、Nwaneri 未写）。NASEM Table 19-1 的 NDF 在第 19 章 pdf p.379–383 文字中只写 neutral detergent fiber (NDF)，未写是否加淀粉酶或扣灰（FIX5 文字层检索；其他章节未查）。跨口径使用误差参数只是近似，须在结果中写明（验收 B05、C03）"
    - "FIX5：concept_match = partial 的条目（haycrop、苜蓿-禾草与禾豆混合青贮映射到 legume_silage_mid，压片大麦映射到粉碎大麦等）只是近似映射；未标注的条目映射未逐条人工审核（验收 B04）"
    - "TMR 条目（SPW15-T5、HR10-T6/T8 MeasTMR）只用于 TMR 核验情景，不是原料参数"
    - "所有条目都是汇总统计（少数农场、非随机抽样，原文未给方差分量置信区间），只作情景或区间，不当作已知常数"
