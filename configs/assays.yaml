    component: "〔FIX5：Hristov 原料 Youden 配对的 SDr/Adj SDr 与 Cherney 表 3–4 已按原文设计改为合并量，见各条 fix5_note〕分量类型的子集：batch_true（真实批次/日/月/田块/窖/场间变异）| sampling（取样代表性）| lab_random（实验室内随机误差，含分样）| lab_bias（实验室系统偏差，同一实验室多送样平均不掉）；列出多项 = 原文无法分开的合并量"
