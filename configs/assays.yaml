# ---------------------------------------------------------------------------
# 原料 × 成分 的 EVSI 可做程度（数据可行性审计 §4.6；G3 2026-09-24 按 error_parameters 重新对齐）
# ---------------------------------------------------------------------------
evsi_feasibility:
  three_component_evsi:
    items: ["corn_silage × {DM, NDF, starch, ash}", "legume_silage_mid × {DM, NDF, CP, ash}"]
    params: "SPW15-T3-*（真实 / 采样 / 分析分开）、SPW15-T4-*（场间 + 残差；月间分量由扣减得到）〔FIX5 更正：原写 T3、T4 都是“真实 / 采样 / 分析分开”〕；BB24A-T5-*（真实分层 + 残差 = 采样 + NIRS，灰分除外）；采样端另有 TU18-T4（仅 DM）、CH21-T4 旁证"
  interval_evsi_partial:
    items: ["corn_silage × CP", "silages × ADF", "silages × lignin"]
    params: "只有 CH21-T2（SEL）、CH21-T3（分样 CV）、CH21-T4（采样 SD 范围）：实验室端与采样端有据，真实日间变异无据（BB2024a 未报告玉米青贮 CP 与 ADF，见 BB24A-T5-*-NR）；真实变异须另设情景（pending_user_decision）"
  blocked:
    items: ["silages × {Ca, P}"]
    params: "DUP24-T2/T3-*（原文表 2–3 为图片，B-108）；在此之前只有 TMR 的采样 + 分析（SPW15-T5-TMR-CA/P-SAMPANAL）可作参照，不能当原料参数"
  interval_evsi_concentrates:
    items: ["corn_grain_dry_medium", "soybean_meal_48", "ddgs", "cottonseed_whole_linted", "corn_grain_high_moisture（备选）"]
    params: "上界 SPW15-T6/T7/T8-*-RESID；下界 HR10-T6/T8（Adj SDr、SDLab）与 AOAC-*〔FIX5：HR10 原料 Youden 配对的 Adj SDr 是 [lab_random, lab_bias] 合并量，不随 k 缩小；AOAC 条目的基础为收样或未写，只作近似〕"
  evppi_only: ["legume_silage_mid × starch", "beet_pulp_dry", "soybean_hulls", "wheat_bran", "cottonseed_meal", "corn_grain_steam_flaked（只有 HR10 实验室端）", "barley_grain_dry_ground（只有 HR10 实验室端）", "canola_meal（补充表未下载前，B-104）", "legume_hay_mid（补充表未下载前；HR10 只有实验室端）", "cool_season_grass_hay_mid"]
  deterministic_inputs: "脂肪粉、矿物、预混料：最多做 AAFCO-AV-* 标签偏差情景的 EVPPI"
  not_done: "NEL、RUP/RDP、peNDF（无直接方差分量）"
  naming_rule: "无误差来源时只称理想信息/上界（EVPPI），不称真实检测收益（合同 §12.4、验收 F05）"

