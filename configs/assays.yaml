# 检测面板与检测误差模型（assays）——draft，未冻结
# 生成：P2b_constraints_units 子任务，2026-09-24；G3_data_assays 2026-09-24 重建误差参数登记（B-138）
# 状态（合同 §2.3）：implemented（结构已起草，draft）；未被代码读取；未冻结。
# FIX5_data_docs 2026-09-24：按红队「data_docs」发现修订非数值字段——Hristov 原料 Youden 配对与 Cherney 分样的 component、
#   AOAC 条目的 basis、NDF 口径（analyte_definition）、概念映射（concept_match）、verification 标签改名；任何 value 都没有改
#   （逐条见 audit/_parts/FIX5_data_docs_record.md；reports/data_audit.md §12.5）。
# 依据：合同 01 §12；02 T7.5–T7.7；数据可行性审计 §0 Q2-6、§4.1–4.6；S6（方差分量笔记，现存 data/restricted_local/phase1_survey_20260924/sources/）。
# 规则：
#   - 检测按样本/面板计费，不臆造每个指标单独收费（合同 §12.3）。本文件没有任何现行检测价格：全部 null。
#   - 误差参数只取自文献；取不到的写 null。文献值多为汇总统计，以区间/情景使用，不当作已知常数
#     （数据可行性审计 §4.1 局限 1–3）。
#   - 无误差来源的“原料 × 成分”只做理想信息（EVPPI），不称真实检测收益（合同 §12.4）。
#   - 单位：除 DM（% as-fed）外均为 %DM 的百分点；文献 SD 按原文单位转录；每条误差参数写明 unit / basis / scale。
#     〔FIX5 更正：并非所有条目都是 %DM——Hristov 为 65 °C 烘干后的收样基础，Hall 2015 为收样基础，其余 AOAC 摘要未写基础；以每条 basis 为准〕
#   - 本文件只含期刊论文与公开章程中的误差统计量，不含 NASEM、AC 系数、CVB、AFZ、Dairy One 数值。
#   - 用语：stage_status 用合同 01 §2.3 枚举；panels / costs 中的 status 与 error_parameters 中的 provenance_status 是
#     datamodel.Provenance 的来源标签（sourced / research_scenario_assumption / pending_user_decision），不是阶段状态；
#     error_parameters 中另有 status（只用 blocked / not_applicable）与 verification（本文件自定义三值，见 entry_schema）。

