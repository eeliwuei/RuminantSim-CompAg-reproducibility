# ---------------------------------------------------------------------------
# 观测模型（合同 02 T7.5）
# ---------------------------------------------------------------------------
observation_model:
  form: "Z_ij = θ_ij,current_batch + ε_sampling,ij + ε_lab_rep,ij + b_lab,ij"
  components:
    theta_current_batch: "本批（本窖）真实成分；先验见 uncertainty.yaml（H0 或 H1 状态；DC-02 规定如何从 P0 SD 扣除历史测量误差）"
    epsilon_sampling: "取样代表性误差；独立样品数 n 增加时按 1/√n 缩小"
    epsilon_lab_rep: "实验室内重复性误差（Adj SDr）；同一研磨样本重复化验 k 次时按 1/√k 缩小。〔FIX5：只指由同一样品真实重复化验得到的重复性（如 HR10 MeasTMR、SPW15-T3 ANAL、CH21-T2 SEL）；Hristov 原料 Youden 配对推出的 SDr/Adj SDr 含实验室 × 原料交互，不属本项，见 resolved_conflicts.hristov_2010_table6〕"
    b_lab: "实验室系统偏差（SDLab）；在同一实验室多送样也平均不掉，不随 n、k 缩小（数据可行性审计 §4.3）"
  component_types:  # error_parameters.entries[].component 的取值与上式各项的对应（G3）
    batch_true: "θ（真实成分）的变异：场间、窖间、田块间、日间、月间；只用于生成真实 θ 或先验"
    sampling: "ε_sampling"
    lab_random: "ε_lab_rep（含实验室分样误差）"
    lab_bias: "b_lab"
    combined: "一条参数列出多项 = 原文无法分开的合并量，只能整体作情景上界/区间，不得再拆"
  aggregation: "n 份独立样品、每份化验 k 次：Var(Z̄ − θ) = σ_s²/n + σ_rep²/(n·k) + σ_lab²"
  scale:
    default: "additive（百分点）"
    status: "research_scenario_assumption"
    rationale: "文献把 SD 报告为百分点；有界成分须截断到 [0,100] 并记录截断比例；小数值矿物（Ca、P）是否改用乘性（CV）待定"
  what_assay_cannot_do:
    - "不会让未来批次/换窖后的变异变为零（合同 T1；数据可行性审计 §4.5：换窖即失效）"
    - "不降低装料误差（S6§2.20）"
    - "重复化验不缩小采样误差与实验室偏差（合同 T7.5）"
  double_counting: "见 uncertainty.yaml double_counting_guards DC-01…DC-05"

# ---------------------------------------------------------------------------
# 候选检测面板（按样本/面板计费）
# ---------------------------------------------------------------------------
panels:
  - panel_id: "PANEL-DM"
    name_zh: "干物质（烘箱法）"
    analytes: ["DM"]
    method: "烘箱干燥（温度/时长须随来源登记）"
    where: "实验室或牧场"
    cost_per_sample: {value: null, currency: null, status: "pending_user_decision", source_needed: "P1-4 价目表或牧场成本"}
    turnaround_days: {value: null, status: "pending_user_decision"}
    status: "research_scenario_assumption"
    rationale: "面板组合本身是研究情景设定，待有来源的实验室服务目录核对（P1-4）"
  - panel_id: "PANEL-NIR-CORE"
    name_zh: "实验室 NIRS 常规面板"
    analytes: ["DM", "CP", "NDF", "starch"]
    method: "商业实验室 NIRS（定标由实验室决定）"
    cost_per_sample: {value: null, currency: null, status: "pending_user_decision"}
    turnaround_days: {value: null, status: "pending_user_decision"}
    status: "research_scenario_assumption"
    rationale: "同上；NIRS 预测值向定标均值收缩（数据可行性审计 §11.1-1），误差不等同湿化学"
  - panel_id: "PANEL-WET-CORE"
    name_zh: "实验室湿化学常规面板"
    analytes: ["DM", "CP", "NDF", "starch"]
    method: "CP（燃烧法或凯氏）、aNDF（加淀粉酶）、淀粉（酶比色 AOAC 2014.10）"
    cost_per_sample: {value: null, currency: null, status: "pending_user_decision"}
    turnaround_days: {value: null, status: "pending_user_decision"}
    status: "research_scenario_assumption"
  - panel_id: "PANEL-MIN"
    name_zh: "常量矿物"
    analytes: ["Ca", "P"]
    method: "湿化学（ICP-OES 等）"
    cost_per_sample: {value: null, currency: null, status: "pending_user_decision"}
    turnaround_days: {value: null, status: "pending_user_decision"}
    status: "research_scenario_assumption"
  - panel_id: "PANEL-FAT"
    name_zh: "粗脂肪 / 总脂肪酸"
    analytes: ["EE"]
    method: "乙醚或己烷浸提（方法不同结果不同，NASEM p.40）；TFA 需气相色谱"
    cost_per_sample: {value: null, currency: null, status: "pending_user_decision"}
    turnaround_days: {value: null, status: "pending_user_decision"}
    status: "research_scenario_assumption"
    note: "EE 上限口径未定（B-P2a-03）；若选 FA 口径，面板改为 TFA"
  - panel_id: "PANEL-HANDHELD-NIR"
    name_zh: "牧场手持 NIR（便宜检测情景）"
    analytes: ["DM", "CP", "NDF"]
    method: "手持近红外"
    cost_per_sample: {value: null, currency: null, status: "pending_user_decision"}
    turnaround_days: {value: 0, status: "research_scenario_assumption", rationale: "现场读数；设备购置与定标成本另计，来源待定"}
    status: "research_scenario_assumption"

panel_overlap_rule: "多项检测的信息有重叠，单项价值不能简单相加；面板价值须按联合或序贯计算（合同 §12.3、验收 F13）"

