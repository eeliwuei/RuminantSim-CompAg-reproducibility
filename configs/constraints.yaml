# 约束登记（constraint registry）——未冻结草案
# 生成：P2b_constraints_units 子任务，2026-09-24
# 状态（合同 §2.3）：implemented（文件已起草）；未被代码读取，未 unit_passed / smoke_passed；未冻结。
#
# 字段契约：合同 01 §6.2 + templates/evidence_contract.yaml 的 constraint_record_required：
#   constraint_id, expression, unit, lower_or_upper, threshold_or_formula, source_locator, animal_stage,
#   standard_version, constraint_class, numerical_tolerance, claim_scope
# 本项目追加字段：status（sourced | pending_user_decision | research_scenario_assumption）、name_zh、
#   failure_category、quantity_type（measured_analyte_based | model_quantity | structural）、dm_source、
#   linearized_row（合同 T2 的 D 乘法线性化形式）、engine_mapping（对应 src/ration_reliability 的
#   ConstraintSpec 语法：kind / terms / sense / bound）、joint_event_candidate、open_decisions。
#
# 规则：
#   - 没有来源的阈值写 null，并标 pending_user_decision 或 research_scenario_assumption（写明理由）。
#   - 浓度约束一律写成 D 乘法线性形式：L·D(q,θ) − N(q,θ) ≤ 0（下限），N(q,θ) − U·D(q,θ) ≤ 0（上限），
#     D、N 都用该情景自身的 d_i(θ) 与 a_ij(θ)（合同 T2、验收 C07）。
#   - structural_hard 约束不受机会约束/风险预算放松（合同 T3、验收 C09）；只用决策时可得的 d̂。
#   - “缺资料”是 data_quality_flag（configs/nutrients.yaml），不是营养违约。
#   - p.N 为 NASEM 2021 印刷页码。model_audit = reports/model_audit.md（P2a）。

schema_version: "0.1-draft"
file_role: "constraint_registry"
created_on: "2026-09-24"
created_by: "P2b_constraints_units (subagent)"
stage_status: "implemented"
frozen: false

record_fields_required:
  - constraint_id
  - expression
  - unit
  - lower_or_upper
  - threshold_or_formula
  - source_locator
  - animal_stage
  - standard_version
  - constraint_class
  - numerical_tolerance
  - claim_scope
record_fields_project:
  - status
  - name_zh
  - failure_category
  - quantity_type
  - dm_source
  - linearized_row
  - engine_mapping
  - joint_event_candidate
  - open_decisions

# ---------------------------------------------------------------------------
# 全局定义
# ---------------------------------------------------------------------------
globals:
  animal_stage: "stable_lactation；参考牛 HOL_MULTI_DIM200_NASEM21T21_v0（configs/animal_profile.yaml；选择待 PUD-P2a-01）"
  standard_version: "NASEM 2021, 8th rev. ed., DOI 10.17226/25806（本地 PDF sha256 e03e9415…a95d49e）"
  symbols:
    q_i: "原物质投料量，kg as-fed/head/d（决策变量）"
    d_hat_i: "决策时可得的 DM 比例估计（t0 参考均值，或 t2 合法检测结果）"
    d_i_theta: "情景 θ 下真实 DM 比例（评估用，决策时不可见）"
    a_ij_theta: "情景 θ 下成分 j 含量，%DM"
    D_hat: "D̂(q) = Σ_i q_i d̂_i，计划 DM 供给，kg DM/head/d"
    D: "D(q,θ) = Σ_i q_i d_i(θ)，实际 DM 供给，kg DM/head/d"
    N_j: "N_j(q,θ) = Σ_i q_i d_i(θ) a_ij(θ)/100，kg/head/d（a 以 %DM 计）"
    DMI_scn: "情景 DMI（Eq 2-1），见 SH-DM-PLAN"
  decision_units_doc: "docs/decision_timing_and_units.md"
  registry_crosswalk:
    NASEM_2021: "SRC-C-NASEM21-T19（全书同一本地 PDF）"
    NYT_2025_draft: "SRC-E-NYT2025-DRAFT"
    NANP_Modeling_DB: "SRC-L-NANPMDB"
    de_Ondarza_2023: "SRC-O-DEONDARZA2023"
    nasem_dairy_pkg: "SRC-M-NASEMDAIRY-PKG"
    registry_file: "sources/source_registry.csv"
  violation_semantics: >-
    某情景下约束 k 违约 ⇔ 以自然单位计的缺口（下限：K − 值；上限：值 − K）大于 numerical_tolerance。
    浓度约束的“值”= N/D（该情景自身的 D）；吸收量约束的“值”= g/head/d。
    缺口幅度按自然单位分别报告，不同单位的缺口不相加（合同 T3）。
  numerical_tolerance_policy:
    value_default: 1.0e-6
    unit: "与各约束 unit 相同"
    status: "research_scenario_assumption"
    rationale: "纯数值容差（防止求解器舍入误判为违约），不是营养允许偏差；开发起点，冻结前确认（合同 T3“冻结容差”）"
  constraint_classes:
    structural_hard: "库存、非负、合法添加量、计划 DM 供给等可执行性条件；不得被机会约束开关放松"
    probabilistic_nutrition: "本研究明确研究的随机营养约束；候选进入联合违约事件 I(q,θ)"
    diagnostic_only: "辅助指标；不得混入主要违约率"
  failure_categories:
    I_nutrient_supply: "营养供给不足或超出（CP、Ca、P）"
    II_carbohydrate_rumen_proxy: "碳水/瘤胃健康代理规格（fNDF、NDF、淀粉、EE）"
    III_data_missing: "原料资料缺失（data_quality_flag，不是营养违约）"
    S_structural: "结构/可执行性"
    DM_supply: "DM 供给偏离（诊断）"
    failure_category_source: "数据可行性审计 §0 Q2-5、§5.2；专家意见第五节 1"

# ---------------------------------------------------------------------------
# 联合违约事件（主要终点的定义）——待冻结
# ---------------------------------------------------------------------------
joint_event:
  definition: "I(q,θ) = 1{至少一条成员约束的缺口 > 冻结容差}；r(q) = P_θ[I(q,θ)=1]（合同 T3）"
  members: null
  status: "pending_user_decision"
  decision_id: "D-09"
  options:
    a: "A 层全部 probabilistic_nutrition：PN-CP-LO、PN-CP-HI、PN-CA-ABS、PN-P-ABS、PN-T1…PN-T5、PN-EE-HI"
    b: "同 a，但上限类（PN-CP-HI、PN-EE-HI）单独报告，不进联合事件"
    c: "I 类（营养供给）与 II 类（碳水/瘤胃代理）分别定义联合事件，指定其一为主要终点"
  constraint_on_membership: "成员只能是阈值已确认（status 不为 pending）的 probabilistic_nutrition 约束；阈值为 null 的约束不能进入正式运行（src 校验规则：pending 值在 pilot/official 模式报错）"
  dev_start_proposal: >-
    开发起点（仅供 smoke，不冻结）：成员 = 阈值已有来源的 PN-T1…PN-T5 + PN-CA-ABS + PN-P-ABS（按推荐选项）；
    CP、EE 在 D-03 定案前不进入任何非 smoke 运行。
  dev_start_proposal_scope: >-
    仅限 smoke。PN-CA-ABS、PN-P-ABS 的 status 仍为 pending_user_decision（PUD-P2a-01/-03/-05），与上面的
    constraint_on_membership 冲突，因此这个成员集合不得延续到 pilot 或 official：
    (1) smoke 输入必须标 dataset_status: synthetic_test_only（validator 在 pilot/official 模式拒绝 synthetic 输入，
        tests/unit/test_config_validator_t9.py::test_synthetic_rejected_in_pilot_and_official 已覆盖）；
    (2) 任何问题配置构建器不得把 status=pending_user_decision 的约束改标为 research_scenario_assumption 后送入
        pilot/official；必须以 status: pending_user_decision、value: null 送给 validator，由其拒绝
        （validator 拒绝 pending 值已由 test_pending_value_must_be_null_and_blocks_pilot 覆盖；
        “构建器改标”这条路径尚无测试 → planned，已记入 audit/_parts/FIX_docs_record.md 交引擎负责人）；
    (3) 进入 pilot 前须由用户对 PUD-P2a-01/-03/-05 拍板，使两条约束的状态不再是 pending。
  structural_separate: "structural_hard 约束单独检查，不计入 r(q)；违反结构约束的方案记为不可执行，不参与风险比较"
  data_quality_separate: "data_quality_flag 单独计数（nutrients.yaml），不计入 r(q)"

# ---------------------------------------------------------------------------
# 约束
# ---------------------------------------------------------------------------
constraints:

  # ======================= structural_hard ===============================

  - constraint_id: "SH-NONNEG"
    name_zh: "投料量非负"
    constraint_class: "structural_hard"
    status: "sourced"
    failure_category: "S_structural"
    quantity_type: "structural"
    expression: "q_i ≥ 0，对全部可用原料 i"
    linearized_row: "−q_i ≤ 0"
    unit: "kg as-fed/head/d"
    lower_or_upper: "lower"
    threshold_or_formula: {value: 0.0, unit: "kg as-fed/head/d"}
    source_locator: "定义性约束：合同 02 T2（q_i 为原物质投料量）"
    animal_stage: "not_applicable"
    standard_version: "not_applicable"
    numerical_tolerance: {value: 1.0e-9, unit: "kg as-fed/head/d", status: "research_scenario_assumption", rationale: "求解器舍入；超出即判 invalid，不裁剪后冒充可行"}
    claim_scope: "可执行性条件，无营养含义"
    dm_source: "not_applicable"
    engine_mapping: {kind: "as_fed", note: "由变量下界实现（lp_builder 变量界）"}
    joint_event_candidate: false

  - constraint_id: "SH-DM-PLAN"
    name_zh: "计划 DM 供给（Σ 结构约束）"
    constraint_class: "structural_hard"
    status: "research_scenario_assumption"
    status_reason: >-
      方程有来源（Eq 2-1，p.12）；输入 BCS = 3.0 是研究情景假设；参考牛选择待 PUD-P2a-01；
      Eq 2-1 与 Eq 20-21 的括号差异待 nasem_dairy 代码核对（B-P2a-01）。
    failure_category: "S_structural"
    quantity_type: "structural"
    expression: "D̂(q) = Σ_i q_i · d̂_i = DMI_scn（内部 DM 形式：Σ_i x_i = DMI_scn，q_i = x_i / d̂_i）"
    linearized_row: "Σ_i q_i d̂_i − DMI_scn = 0"
    unit: "kg DM/head/d"
    lower_or_upper: "equality"
    threshold_or_formula:
      main:
        value_ref: "withheld (public copy): Eq 2-1 (p.12) evaluated at the Table 21-1 (p.471) reference-cow inputs of configs/animal_profile.yaml fields.*; holder value in build_report.json"
        value: null
        unit: "kg DM/head/d"
        derivation: "Eq 2-1 手算（model_audit §3.3；animal_profile.yaml dry_matter_intake.computed_value_kg_d）"
      sensitivity_scenarios_E5:
        - {id: "DMI_minus10", value: null, unit: "kg DM/head/d", derivation: "main × 0.9", value_ref: "withheld (public copy): Eq 2-1 (p.12) evaluated at the Table 21-1 (p.471) reference-cow inputs of configs/animal_profile.yaml fields.*; holder value in build_report.json"}
        - {id: "DMI_plus10", value: null, unit: "kg DM/head/d", derivation: "main × 1.1", value_ref: "withheld (public copy): Eq 2-1 (p.12) evaluated at the Table 21-1 (p.471) reference-cow inputs of configs/animal_profile.yaml fields.*; holder value in build_report.json"}
      sensitivity_status: "research_scenario_assumption（±10% 是 P2a 设定的敏感性幅度，不是 NASEM 给出的误差带）"
      dmi_equation_version_pending:
        status: "pending_user_decision"
        decision_ids: ["PUD-P2a-06（nasem_dairy 代码核对）", "PUD-P2a-08（统一取舍原则）"]
        alternative_value: {id: "DMI_eq20_21_literal", value: null, unit: "kg DM/head/d", derivation: "Eq 20-21 印刷括号字面式（p.423；model_audit §3.4）", value_ref: "withheld (public copy): computed from the Table 21-1/21-3 (p.471-473) reference-cow inputs with the equations named in this block (Eq 2-1, Eq 3-13...3-20, Eq 7-1...7-8, Eq 20-373...20-389)"}
        rule_until_resolved: >-
          代码核对前，凡用到 DMI_scn 的结果同时报告 Eq 2-1（⟨withheld⟩）与 Eq 20-21 字面式（⟨withheld⟩）两个版本（红队发现：
          只有字面式能复现 Table 21-1 头胎两列，model_audit §3.5）。smoke 暂用 ⟨withheld⟩，只代表开发起点，不代表已定案。
    source_locator: "NASEM 2021 Eq 2-1（p.12）；p.13（BCS 斜率佐证）；model_audit §3；configs/animal_profile.yaml"
    animal_stage: "stable_lactation（多胎荷斯坦 700 kg，DIM 200，产奶 ⟨withheld⟩ kg/d）"
    standard_version: "NASEM 2021（Eq 2-1，仅动物因素）"
    numerical_tolerance: {value: 1.0e-6, unit: "kg DM/head/d", status: "research_scenario_assumption", rationale: "等式的数值容差"}
    claim_scope: >-
      这是供给模型：计划投喂的 DM 等于情景 DMI，不是观测采食量。假定全部采食、无剩料、无挑食，对所有方法一致
      （合同 §6.3、验收 C04）。DMI 固定为情景值，不随配方变化（数据可行性审计 §5.1）。
    dm_source: "decision_estimate"
    engine_mapping: {kind: "supply", terms: {"DM": 1.0}, sense: "eq", bound: null, unit: "kg/d", dm_source: "decision_estimate"}
    joint_event_candidate: false
    notes:
      - "实际 DM 供给 D(q,θ) 随 d_i(θ) 偏离 DMI_scn；不要求每个情景满足等式（合同 T2），偏离程度由 DIAG-DM-REAL 报告"
      - "E5 的 ±10% 情景是整套问题换一个 DMI_scn 重解，不是允许优化器在区间内自选 DM 供给（否则优化器会压低供给以省钱）"
      - "当 t2 取得某原料 DM 检测结果时，只对已检测原料更新 d̂_i（合同 T1）"
    open_decisions: ["PUD-P2a-01", "PUD-P2a-02", "B-P2a-01", "PUD-P2a-06", "PUD-P2a-08"]

  - constraint_id: "SH-INCL"
    name_zh: "原料添加量上下限（计划 DM 占比）"
    constraint_class: "structural_hard"
    status: "pending_user_decision"
    status_reason: "逐原料上下限没有带出处的数值（数据可行性审计 §5.2；route_decision §3；D-04）"
    failure_category: "S_structural"
    quantity_type: "structural"
    expression: "l_i ≤ q_i d̂_i / D̂(q) ≤ u_i；因 D̂ = DMI_scn（SH-DM-PLAN），等价于 l_i·DMI_scn ≤ q_i d̂_i ≤ u_i·DMI_scn"
    linearized_row: "l_i·DMI_scn − q_i d̂_i ≤ 0；q_i d̂_i − u_i·DMI_scn ≤ 0"
    unit: "fraction of planned DM"
    lower_or_upper: "both"
    threshold_or_formula:
      per_ingredient: null
      note: "逐原料 l_i、u_i 全部为 null；原料清单见 configs/inventories.yaml ingredient_catalog"
      candidate_sources:
        - {source: "NANP Modeling DB 'Dietary Ingredients' 表中稳定泌乳期处理的原料添加比例分布", access: "需用户注册登录（P0-4）", status: "blocked"}
        - {source: "de Ondarza et al. 2023 数据集（doi:10.26207/hcjx-8w62）", limitation: "只有日粮层面营养与粗料比例，无逐原料添加量；In Copyright，仅内部分析", status: "pending_user_decision"}
        - {source: "专家判断", requirement: "记录判断人与日期；未获得时不得写“已审阅”（合同 §6.2）", status: "pending_user_decision"}
        - {source: "CYRP 原料上下限", limitation: "按肉牛定，不适用奶牛，只能作参考起点（数据可行性审计 §6）", status: "not_applicable"}
      nasem_text_observations_not_limits:
        - "日粮 DM 近 30% 为酒糟时出现显著乳脂下降，莫能菌素加重（p.332，引 Morris et al. 2018b）——是试验观察，不是添加上限"
        - "泌乳牛采食含 10% 与 15% DM 全棉籽的日粮 60 d 后乳中检出棉酚（p.340，引 Wang et al. 2012）——是试验观察，不是添加上限"
      design_note: >-
        主约束集里没有 Na 约束、也没有能量约束：若食盐、小苏打、脂肪粉没有下限，最低成本解会把它们设为 0。
        它们的下限或固定添加量须随 D-04 一并决定（见 open_questions Q-06）。
    source_locator: null
    animal_stage: "stable_lactation"
    standard_version: "not_applicable（不是 NASEM 条款）"
    numerical_tolerance: {value: 1.0e-6, unit: "fraction of planned DM", status: "research_scenario_assumption", rationale: "数值容差"}
    claim_scope: "可执行性/配方规格；上下限来源决定其解释。实际 DM 占比 q_i d_i(θ)/D(q,θ) 随 θ 变化，由 DIAG-INCL-REAL 报告（合同 T2.3）"
    dm_source: "decision_estimate"
    engine_mapping: {kind: "concentration", terms_template: {"DM:<ingredient>": 1.0}, sense: "ge / le", bound: null, unit: "fraction", dm_source: "decision_estimate"}
    joint_event_candidate: false
    open_decisions: ["D-04", "P0-4"]

  - constraint_id: "SH-INV"
    name_zh: "批次库存覆盖"
    constraint_class: "structural_hard"
    status: "pending_user_decision"
    status_reason: "批次库存 B_i、覆盖头数 H、使用天数 T 均无来源（configs/inventories.yaml）"
    failure_category: "S_structural"
    quantity_type: "structural"
    expression: "H · T · q_i ≤ B_i（B_i 为 kg as-fed 库存）"
    linearized_row: "q_i − B_i/(H·T) ≤ 0"
    unit: "kg as-fed/head/d"
    lower_or_upper: "upper"
    threshold_or_formula: {formula: "B_i / (H·T)", B_i: null, H: null, T: null}
    source_locator: "合同 02 T2.3；合同 01 §12.5"
    animal_stage: "not_applicable"
    standard_version: "not_applicable"
    numerical_tolerance: {value: 1.0e-6, unit: "kg as-fed/head/d", status: "research_scenario_assumption", rationale: "数值容差"}
    claim_scope: "可执行性。T 或 q 因检测/换方改变时须重新核验覆盖，不能套用固定乘数（合同 §12.5）"
    dm_source: "not_applicable"
    engine_mapping: {kind: "as_fed", terms_template: {"AF:<ingredient>": 1.0}, sense: "le", bound: "B_i/(H·T)", unit: "kg/d"}
    joint_event_candidate: false
    notes: "主分析若不设库存约束，须在 protocol 中明写“库存不受限（B_i = ∞）”作为研究情景，而不是默认省略"
    open_decisions: ["INV-B", "INV-H", "INV-T"]

  - constraint_id: "CAND-T51-PRECOND"
    name_zh: "候选：干粉碎玉米为主要淀粉源（Table 5-1 前提的操作化）"
    constraint_class: "structural_hard"
    status: "pending_user_decision"
    status_reason: "是否采用、以及“主要”=占日粮淀粉 ≥50% 的操作化都待定（B-P2a-04 选项 a）"
    failure_category: "S_structural"
    quantity_type: "structural"
    expression: "Σ_{i∈干粉碎玉米} x_i · S̄_i ≥ θ_share · Σ_i x_i · S̄_i（S̄_i = t0 参考淀粉均值；x_i = q_i d̂_i）"
    linearized_row: "Σ_i q_i d̂_i S̄_i (θ_share − 1{i∈干粉碎玉米}) ≤ 0"
    unit: "fraction of dietary starch"
    lower_or_upper: "lower"
    threshold_or_formula:
      theta_share: {value: 0.5, status: "research_scenario_assumption", rationale: "对 NASEM “predominant starch source” 的操作化（model_audit §9.6 选项 a）；原文没有数值"}
    source_locator: "NASEM 2021 Table 5-1 标题前提（p.63）；p.63–64 对快速发酵淀粉源的定性提示；model_audit §9.6"
    animal_stage: "stable_lactation（TMR）"
    standard_version: "NASEM 2021（前提条件的操作化，非 NASEM 条款）"
    numerical_tolerance: {value: 1.0e-6, unit: "fraction", status: "research_scenario_assumption", rationale: "数值容差"}
    claim_scope: "只保证配方层面满足 Table 5-1 的淀粉来源前提；不评估淀粉发酵速率"
    dm_source: "decision_estimate"
    engine_mapping: {kind: "concentration", note: "需要“按 t0 参考均值计算的结构约束”；现有 compile 规则禁止 structural_hard 含成分项，采用此选项须扩展引擎并加测试"}
    joint_event_candidate: false
    alternatives: "B-P2a-04 选项 (b) 照用 Table 5-1 并写入局限；选项 (c) 收紧 T1–T5（研究假设）；库存层面的替代实现见 inventories.yaml INV-2"
    open_decisions: ["B-P2a-04"]

  # ======================= probabilistic_nutrition：I 类 ===================

  - constraint_id: "PN-CP-LO"
    name_zh: "粗蛋白浓度下限（配方规格）"
    constraint_class: "probabilistic_nutrition"
    status: "pending_user_decision"
