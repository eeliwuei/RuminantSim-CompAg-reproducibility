# ---------------------------------------------------------------------------
# 需要写成单元测试的检查（交给实现任务；全部 planned）
# ---------------------------------------------------------------------------
unit_test_requirements:
  - "Table 5-1 边界点 B01–B15（model_audit §9.5）逐点满足/违反与预期一致"
  - "D 乘法形式与比值形式在 D > 0 时判定一致；D = 0 时返回 invalid_input，不静默通过"
  - "全体 d_i 乘同一常数时 PN-T1…T5 判定不变（齐次）；PN-CA-ABS、PN-P-ABS 随之变化（非齐次）"
  - "structural_hard 只用 d̂；以 d(θ) 替换 d̂ 应改变 PN 类结果但不改变 SH 类判定（防泄漏）"
  - "阈值为 null 的约束在 pilot/official 模式被 validator 拒绝"
  - "缺失成分（DQF-MISSING）不被当作 0 计入供给"

# ---------------------------------------------------------------------------
# 本文件范围内的未决问题
# ---------------------------------------------------------------------------
open_questions:
  - {id: "Q-01", item: "A 层是否加能量约束（CAND-ENERGY 的 EN-0…EN-3）", why: "不加时最低成本配方可能能量不现实，影响 RQ2 解释"}
  - {id: "Q-02", item: "联合事件成员（D-09）", why: "主要终点定义"}
  - {id: "Q-03", item: "CP 下/上限、脂肪上限的口径与数值（D-03、B-P2a-02、B-P2a-03）", why: "3 条 PN 约束无阈值"}
  - {id: "Q-04", item: "Ca、P 右端项选项（PUD-P2a-03、-04、-05）", why: "默认值按 P2a 推荐给出，未拍板"}
  - {id: "Q-05", item: "Table 5-1 淀粉源前提的处理（B-P2a-04：CAND-T51-PRECOND / 照用并写局限 / 收紧 / INV-2）", why: "II 类约束的适用性"}
  - {id: "Q-06", item: "食盐、小苏打、脂肪粉、预混料的添加规则（D-04、B-P3A-2）", why: "主约束集不含 Na 与能量，没有下限时它们会被优化为 0"}
  - {id: "Q-07", item: "数值容差 1e-6（自然单位）是否冻结", why: "合同 T3 要求冻结容差"}
  - {id: "Q-08", item: "DIAG-DM-REAL 是否升级为 probabilistic_nutrition", why: "DM 通道是否单独构成违约"}
