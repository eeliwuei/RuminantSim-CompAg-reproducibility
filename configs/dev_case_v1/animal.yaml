# 开发案例 v1：参考牛与营养模型版本（R4，第二轮整改，K4_nutrition_case）
# 状态（合同 §2.3）：implemented。只用于开发案例 dev_case_v1，不是 protocol_frozen，不进入正式结果。
# 数值规则：参考牛的 Table 21-1/21-3 输入不在本文件复制，用 value_from 指向已被跟踪的 configs/animal_profile.yaml；
#           本文件只写方程系数、正文值、研究假设与由方程推导的值；NASEM 表值（Table 19-x、AC 等）只在 data/restricted_local/dev_case_v1/。
# 页码：印刷页 p.N（本地 PDF 页 = 印刷页 + 20）。

schema: ration_reliability.dev_case/0.1
case_id: dev_case_v1
file_role: animal
stage_status: implemented
frozen: false

reference_cow:
  profile_id: HOL_MULTI_DIM200_NASEM21T21_v0
  status: research_scenario_assumption
  rationale: >-
    开发案例只需一个参考牛（合同 T6）。选 NASEM 2021 Table 21-1（p.471）经产（Mature）荷斯坦中泌乳期最晚的一列
    （列标识与各输入值见已被跟踪的 configs/animal_profile.yaml，本文件不复制）：书中自带示例牛，除 BCS 外输入均有页码，
    处于稳定泌乳期，已妊娠（天数见 Table 21-1 脚注 a）。选择本身是研究设定（原 PUD-P2a-01 的开发期取值），
    不声称它代表任何牧场。
  value_resolution: >-
    value_from = "<被跟踪文件>#<键路径>"，由 ration_reliability.nutrition.requirements.resolve_value_refs 解析
    （拒绝指向 data/restricted_local 的 value_from；受限值只能写 value_ref，由调用方提供），再交给
    requirements_from_config（调用层只接受已解析的 value）。构建脚本与 tests/numerical/test_energy_linearization.py
    走同一解析函数（K4c，2026-09-25）。
  inputs:                       # Table 21-1/21-3 的数值不在此复制：value_from 指向已被跟踪的 configs/animal_profile.yaml（B-318 待定）
    breed: {value: Holstein, source: "Table 21-1 标题（p.471）；Eq 2-1 只用荷斯坦数据（p.13）"}
    parity_eq2_1: {value: 1, unit: "1", source: "Table 21-1 Mature 列 = 经产；Eq 2-1 Parity 取 0–1（p.12）；代码 An_Parity_rl − 1"}
    body_weight: {value_from: "configs/animal_profile.yaml#fields.body_weight_kg.value", unit: kg, source: "Table 21-1（p.471）"}
    mature_body_weight: {value_from: "configs/animal_profile.yaml#fields.mature_body_weight_kg.value", unit: kg, source: "p.32"}
    body_condition_score:
      value: 3.0
      unit: "1"
      status: research_scenario_assumption
      rationale: "Table 21-1 未列 BCS；Eq 2-1 建模数据均值 3.03（p.12）；模型以 BCS 3.0 标准化（p.444）"
    days_in_milk: {value_from: "configs/animal_profile.yaml#fields.days_in_milk.value", unit: d, source: "Table 21-1（p.471）"}
    milk_yield: {value_from: "configs/animal_profile.yaml#fields.milk_yield_kg_d.value", unit: kg/d, source: "Table 21-1（p.471）", role: "固定情景输入，不是预测"}
    milk_fat: {value_from: "configs/animal_profile.yaml#fields.milk_fat_pct.value", unit: "%", source: "Table 21-1（p.471）"}
    milk_true_protein: {value_from: "configs/animal_profile.yaml#fields.milk_true_protein_pct.value", unit: "%", source: "Table 21-3（p.473），按真蛋白解读（animal_profile basis_note）"}
    milk_lactose: {value: 4.85, unit: "%", source: "未测时默认 0.0485 kg/kg（p.30，正文值）"}
    days_pregnant: {value_from: "configs/animal_profile.yaml#fields.pregnancy.days_pregnant.value", unit: d, source: "Table 21-1 脚注 a（p.471）"}
    calf_birth_weight: {value: 44, unit: kg, source: "经产荷斯坦犊牛初生重（p.31，正文值）"}
    frame_gain: {value_from: "configs/animal_profile.yaml#fields.body_weight_change.frame_gain_kg_d.value", unit: kg/d, source: "Table 21-1 脚注 a（p.471）"}
    reserves_gain: {value_from: "configs/animal_profile.yaml#fields.body_weight_change.reserves_gain_kg_d.value", unit: kg/d, source: "Table 21-1 脚注 a（p.471）"}
    body_weight_gain_for_minerals: {value_from: "configs/animal_profile.yaml#fields.body_weight_change.An_BWgain_kg_d.value", unit: kg/d,
                                    source: "Frm_Gain + Rsrv_Gain（Eq 20-247，p.444；代码 calculate_Body_Gain）"}
    housing: {value: "舍饲 TMR，热中性，非放牧", status: research_scenario_assumption,
              rationale: "Eq 2-1 数据条件（p.12）；维持需要已含舍饲正常活动（p.30–31）；NASEM 不对热应激调整维持（p.31）"}

