cost_semantics:
  unit: "USD/头/日（原物质投料 q × 原物质价格）"
  basis: "q 为原物质决策；DM 基础报价在载入时用决策时 d̂ 一次换成原物质价，不随抽样变化（合同 T2.2；dm_basis_semantics 枚举）"
  excludes: ["运费与到场成本", "加工（粉碎、制粒）", "损耗与剩料", "盐、小苏打、预混料（不在模型内，所有方法相同的缺项）"]
