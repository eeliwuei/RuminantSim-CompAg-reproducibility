scenario_statement: >-
  美国中西部（Iowa / Missouri / Minnesota–Dakotas）2026 年 9 月中旬的公开报价与推广机构参考价。
  运费、加工（玉米粉碎）、损耗、仓储均未计入，所有方法同一价格向量；成本差只在本价格情景下有意义。
common_status_of_scenario_choice: research_scenario_assumption
common_rationale: >-
  没有牧场采购合同；选同一周、同一地区的公开价作为一个可复核的价格情景（合同 T2.2：记录币种与年份/情景；
  固定价格下的成本优势不是一般市场节约）。

