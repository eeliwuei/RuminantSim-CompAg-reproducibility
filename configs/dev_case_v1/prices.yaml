# 开发案例 v1：价格情景（R4 第 5 项）——有日期、有来源的公开价格；无市场价的玉米青贮用有文献的定价规则
# 状态（合同 §2.3）：implemented。无 placeholder：每个价格都有 URL、报告名、日期、单位、原物质/干物质基础、币种；
#   规则价与情景选择标 research_scenario_assumption。
# 读取方式：WebFetch 只读（K4，2026-09-25）。AMS PDF 由 WebFetch 工具自动缓存在会话 tool-results 目录（不在项目内），
#   用 pdftotext 逐字读出下列行。K4c 于 2026-09-24T17:4xZ（= 09-25 KST）重新打开全部 8 个页面逐项核对数值、日期与页码，
#   三份 AMS PDF 的 sha256 与创建时间记在 audit/_parts/round2/K4_nutrition_case_record.md §3（K4 当时未留 sha256）。
# 持久定位：ams_*.pdf 是“最新一期”指针，会被下一期覆盖；复核时以“报告编号 + 报告日期”在 USDA MyMarketNews
#   （https://mymarketnews.ams.usda.gov/viewReport/<编号>）查同一期，而不是依赖该 URL 当前内容。
# 价格只代表“美国中西部 2026 年 9 月中旬、交易点报价”这一个研究情景；不是牧场到场成本，不是一般市场节约。
# FIX_B（2026-09-25，第二轮红队 B）：石粉、磷酸氢钙两项由 sourced 改为 research_scenario_assumption——MU FEEDVAL II 页面
#   只给计算日期，没有这两项的上游来源或观测期间（不满足 R4-3“注明期间”）；数值不变。其余 6 项状态不变。

