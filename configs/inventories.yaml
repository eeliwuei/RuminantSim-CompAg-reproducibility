parameter_file_rules: >-
  只用 entry_agreement ∈ {both_agree, resolved} 的行；需要离散度时只用 statistic_type = summary_mean_sd_n；
  用核心表第 33 列 concept_id 与本文件 ingredient_id 连接，一个概念对应多个条目（beet_pulp_dry、ddgs、corn_grain_high_moisture）
  时必须显式选定 nasem_feed_id，不得按“条目 id = 概念 id”静默连接（data/data_dictionary.md §3.2、§5 第 10–11 条）。
  石粉候选 NRC16F1003 不在核心表（只有 A 单录入，字典 §3.1 P-6），选它之前须先补第二次录入。
parameter_file_superseded: "2026-09-24 前指向 data/restricted_local/nasem_t19_1_entry_A.csv（A 单录入，sha256 917d2d40…9b502，含 576 个只有单录入的键）——已废止（红队 D B08/B10；BLOCKERS B-132；W1）"
grade_legend:
  A: "多个谱系有 SD，且有方差分量或行级数据"
  B: "多个谱系有 SD"
  C: "只有单一已核谱系，或 n 较小，或定义不符"
  D: "只有点值或标签值，作为确定性输入"
  V: "有方差分量（单一谱系 + V 记 C/V）"
  source: "数据可行性审计 §0 Q3 分级依据与终审修订说明"
  caveat_20260924: "A、B 级所依赖的 AFZ、CVB SD 目前未在本项目内核实（AFZ 为 WebFetch 转述，CVB 为调研在项目外读 PDF；audit/data_feasibility_report.md §3.3）；许可（P0-9）与原始导出复核完成前，分级只作开发参考，不作证据等级声明"

forage_flag_rule:
  definition: "forage_flag_i = 1 − Fd_Conc_i/100，用于 fNDF_i = forage_flag_i · NDF_i（NASEM Eq 20-29，p.424）"
  basis: "NASEM 饲料类别/类型（p.360；Table 20-7，p.424：'Grain crop forage' = 玉米与小粒谷物全株粗料；'Grass/legume forage'）"
  status_note: "印刷版 Table 19-1 无 Fd_Conc 列；下列取值按类别推定，须与 nasem_dairy 饲料库核对（PUD-P2a-06）"
  verification_status: "blocked：用 nasem_dairy 饲料库 Fd_Conc 逐条核对需要安装 nasem_dairy 1.0.2（P1-7/PUD-P2a-06，未获批准）；在此之前全部 forage_flag 仍是 research_scenario_assumption（红队 B04）"

