inventory_scenarios:

  - inventory_id: "INV-1"
    name_zh: "核心 21 种全可用"
    status: "research_scenario_assumption"
    basis: "数据可行性审计 §0 Q3 推荐的核心清单（15 种随机 + 6 种确定性）；route_decision §4.2"
    available: ["corn_silage", "legume_silage_mid", "legume_hay_mid", "cool_season_grass_hay_mid",
                "corn_grain_dry_medium", "corn_grain_steam_flaked", "barley_grain_dry_ground", "beet_pulp_dry",
                "wheat_bran", "soybean_hulls", "soybean_meal_48", "canola_meal", "cottonseed_meal", "ddgs",
                "cottonseed_whole_linted", "calcium_soaps", "limestone", "dicalcium_phosphate", "salt",
                "sodium_bicarbonate", "premix"]
    role_in_study: "主分析默认库存"
    caveats:
      - "含压片玉米、大麦 → Table 5-1 “干粉碎玉米为主要淀粉源”前提可能不成立（B-P2a-04）；须配合 CAND-T51-PRECOND 或写入局限"
      - "预混料在标签确定前不进入求解（premix.handling_until_decided）"
      - "甜菜粕、DDGS 的条目二选一待定（D-08、D-05）"
    batch_inventory_kg_as_fed: null
    covered_heads_H: null
    covered_days_T: null
    open_decisions: ["D-04", "D-05", "D-08", "B-P2a-04", "B-P3A-2"]

  - inventory_id: "INV-2"
    name_zh: "Table 5-1 前提相容库存（去掉压片玉米、大麦）"
    status: "research_scenario_assumption"
    basis: >-
      NASEM 2021 Table 5-1 的适用前提之一是以干粉碎玉米为主要淀粉源（p.63）；p.63–64 指出高比例使用发酵较快的
      淀粉源（如大麦）时须提高 fNDF，但没有给出定量折算（model_audit §9.1、§9.6）。去掉这两种原料后，
      日粮淀粉只可能来自干粉碎玉米和副产品/粗料，Table 5-1 的使用条件在库存层面成立。
    available: ["corn_silage", "legume_silage_mid", "legume_hay_mid", "cool_season_grass_hay_mid",
                "corn_grain_dry_medium", "beet_pulp_dry", "wheat_bran", "soybean_hulls", "soybean_meal_48",
                "canola_meal", "cottonseed_meal", "ddgs", "cottonseed_whole_linted", "calcium_soaps", "limestone",
                "dicalcium_phosphate", "salt", "sodium_bicarbonate", "premix"]
    excluded:
      - {ingredient_id: "corn_grain_steam_flaked", reason: "发酵较快的淀粉源，p.63–64"}
      - {ingredient_id: "barley_grain_dry_ground", reason: "发酵较快的淀粉源，p.63–64"}
    role_in_study: "检验 Table 5-1 前提处理方式（B-P2a-04）对结论的影响；与 INV-1 + CAND-T51-PRECOND 可互为对照"
    caveats:
      - "玉米青贮自身的淀粉是否算“干粉碎玉米”之外的主要来源，NASEM 未说明；DIAG-T51-STARCH-SOURCE 报告实际占比"
    batch_inventory_kg_as_fed: null
    covered_heads_H: null
    covered_days_T: null
    open_decisions: ["B-P2a-04"]

  - inventory_id: "INV-3"
    name_zh: "证据较强子集（去掉 C 级随机原料）"
    status: "research_scenario_assumption"
    basis: >-
      数据可行性审计 §0 Q3 的数据质量分级：C 级原料只有单一已核谱系或 n 较小（豆科青贮 C/V、冷季禾本科干草 C、
      压片玉米 C、干甜菜粕 C、棉籽粕 C+）。审计写明 C 级原料留在核心清单须在 protocol 中说明理由，
      并指出压片玉米、甜菜粕可用于检验“小样本参数不确定性”的影响（D-16）。本情景用来看结论是否依赖证据较弱的原料。
    available: ["corn_silage", "legume_hay_mid", "corn_grain_dry_medium", "barley_grain_dry_ground",
                "wheat_bran", "soybean_hulls", "soybean_meal_48", "canola_meal", "ddgs", "cottonseed_whole_linted",
                "calcium_soaps", "limestone", "dicalcium_phosphate", "salt", "sodium_bicarbonate", "premix"]
    excluded:
      - {ingredient_id: "legume_silage_mid", reason: "C/V"}
      - {ingredient_id: "cool_season_grass_hay_mid", reason: "C"}
      - {ingredient_id: "corn_grain_steam_flaked", reason: "C"}
      - {ingredient_id: "beet_pulp_dry", reason: "C（若 D-08 选 F15 且上调等级，则应放回并重述本情景）"}
      - {ingredient_id: "cottonseed_meal", reason: "C+"}
    role_in_study: "E5 敏感性：结论对 C 级原料参数不确定性的依赖"
    caveats:
      - "粗饲料只剩玉米青贮和豆科干草；可行性须在开发阶段先验证（proven_infeasible 也要如实报告）"
      - "去掉原料会同时改变成本；与 INV-1 的差异不能全部归因于参数不确定性"
    batch_inventory_kg_as_fed: null
    covered_heads_H: null
    covered_days_T: null
    open_decisions: ["D-16", "D-08"]

