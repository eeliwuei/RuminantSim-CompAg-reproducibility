# ---------------------------------------------------------------------------
# 数据质量标记（缺资料 ≠ 营养违约）
# ---------------------------------------------------------------------------
data_quality_flags:
  semantics: "以下标记单独计数与报告，不进入联合营养违约事件 I(q,θ)，也不当作营养不足（合同 T3、数据可行性审计 §0 Q2-5）"
  flags:
    - id: "DQF-MISSING"
      meaning: "原料 × 成分在来源表中为空（无数据）"
      handling: "不补零；该原料在涉及此成分的约束中不可用或须用户批准的借用规则（uncertainty.yaml missing_value_policy）"
    - id: "DQF-SINGLE-SOURCE"
      meaning: "只有均值、无 SD/N（单一来源点值或估算值，如估算 TFA）"
      handling: "不能生成随机抽样；按 uncertainty.yaml 的 point_value_policy 处理并标注"
    - id: "DQF-SMALL-N"
      meaning: "n < 100 的参数"
      handling: "单独报告参数不确定性（数据可行性审计 §0 Q2-2）"
    - id: "DQF-DEFINITION-RISK"
      meaning: "原料定义不符（如 canola 与中国菜籽粕）"
      handling: "结论限定于 NASEM 条目定义；中国原料只进情景"
    - id: "DQF-LABEL-MISSING"
      meaning: "确定性原料无有来源的标签值（预混料）"
      handling: "该原料不进入求解或按用户决定处理（B-P3A-2）"
    - id: "DQF-TRUNCATION"
      meaning: "抽样值落在物理边界外被截断/重抽"
      handling: "记录截断比例；截断会改变均值时报告"
    - id: "DQF-ROM-NEGATIVE"
      meaning: "日粮 ROM 计算为负（成分重叠或统计不一致）"
      handling: "诊断记录，不修改成分（NASEM p.361 同样保留负 ROM）"
