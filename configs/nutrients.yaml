# 营养成分登记（nutrient registry）——未冻结草案
# 生成：P2b_constraints_units 子任务，2026-09-24
# 状态（合同 §2.3）：implemented（文件已起草）；未被代码读取，未 unit_passed / smoke_passed；未冻结。
# 规则：
#   - 本文件只登记“成分是什么、单位与基础、是否实测、如何换算”，不含任何原料成分数值。
#     NASEM Table 19-1/19-3 的均值/SD/N 只存在 data/restricted_local/（不进 git）。
#   - status 取值：sourced | pending_user_decision | research_scenario_assumption | not_applicable
