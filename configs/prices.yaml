# 价格情景（prices）——draft，未冻结；本文件不含任何价格数值
# 生成：P2b_constraints_units 子任务，2026-09-24
# 状态（合同 §2.3）：implemented（结构与字段已起草）；价格值全部 null；未冻结。
# 依据：
#   - 内部资产没有任何有来源、有日期的原料价格（S8 §2.6；BLOCKERS B-005；DECISIONS D-009）。
#   - 候选外部来源：数据可行性审计 §1.4 #27–28、§5.3-3/4、§10 P1-3。
#   - 价格基础与换算规则：合同 02 T2.2；docs/decision_timing_and_units.md §6。
# 规则：没有来源的价格一律 null；取得来源前，正文只能写“在所设情景价格下的成本差”（数据可行性审计 §5.3-4）。
#       不得把固定价格下的成本差称为市场节约或动物收入（合同 T2.2）。

schema_version: "0.1-draft"
file_role: "price_scenarios"
created_on: "2026-09-24"
created_by: "P2b_constraints_units (subagent)"
stage_status: "implemented"
draft: true
frozen: false

# ---------------------------------------------------------------------------
# 统一口径
# ---------------------------------------------------------------------------
price_basis:
  internal_unit: "<CUR>/kg as-fed"
  decision_link: "C(q) = Σ_i p_i q_i，单位 <CUR>/head/d（合同 02 T2）"
  fixed_across_draws: true
  fixed_across_draws_rule: "报价基准一旦固定，不随测试抽样变化；不得用抽到的 DM 重算价格（合同 T2.2）"
  record_required: ["currency", "price_date_or_period", "market_or_location", "grade_or_spec", "quote_basis", "source_id", "access_date", "local_path", "sha256"]
  conversions:
    - id: "PC-01"
      from: "<CUR>/metric tonne as-fed"
      to: "<CUR>/kg as-fed"
      rule: "除以 1000"
      status: "sourced"
      source: "SI 定义；合同 T2.2"
    - id: "PC-02"
      from: "<CUR>/short ton as-fed（美国报价常用 ton = 2000 lb）"
      to: "<CUR>/kg as-fed"
      rule: "除以 907.18474（= 2000 × 0.45359237 kg）"
      status: "sourced"
      source: "lb = 0.45359237 kg（NIST SP 811 App. B.8，已登记于 src/ration_reliability/normalization/units.py）；short ton = 2000 lb（同附录）"
      caution: "ERS 表中的 ton 是否为 short ton 须在下载后按表头核实；不得默认为公吨"
    - id: "PC-03"
      from: "<CUR>/bushel"
      to: "<CUR>/kg as-fed"
      rule: "除以该商品的法定蒲式耳重量（kg/bu）"
      bushel_weight_kg: null
      status: "pending_user_decision"
      rationale: "蒲式耳重量因作物而异，须引用 USDA 官方换算表（候选：USDA ERS/AMS《Weights, Measures, and Conversion Factors for Agricultural Commodities and Their Products》Ag Handbook 697，本轮未访问）后再填"
    - id: "PC-04"
      from: "<CUR>/kg DM"
      to: "<CUR>/kg as-fed"
      rule: "p_AF = p_DM × d_quote，d_quote 必须是报价本身声明的 DM 语义（合同 T2.2）"
      status: "sourced"
      source: "合同 T2.2；数据可行性审计 §5.3-3"
      caution: "d_quote 不是情景抽样的 d_i(θ)；报价没有写明 DM 语义时不得换算"
    - id: "PC-05"
      from: "按实测 DM 结算的合同价"
      to: "单独的合同情景"
      rule: "不混入默认原物质计价模型（合同 T2.2）"
      status: "sourced"
  currency_and_year:
    rule: "每个价格情景写明货币与价格日期/期间；跨年份比较需有来源的平减指数，否则不做通胀调整"
    deflator: null
    deflator_status: "pending_user_decision"

