    requires: ["D-01", "P1-3 ②（中国价格来源）"]
  - price_id: "PRC-3"
    name_zh: "相对价格变动情景（同一来源内的历史极端月份）"
    currency: "同 PRC-1"
    price_date_or_period: null
    is_scenario: false
    items: null
    status: "pending_user_decision"
    construction_candidate: >-
      在 PRC-1 同一序列内，预先规定一个价格比（例如蛋白料/能量料价格比）并取其历史高、低分位对应的真实月份，
      而不是人为设定 ±x% 的价格。比值定义与分位点须在开发阶段登记。
    construction_status: "research_scenario_assumption"
    requires: ["PRC-1 可用"]

fallback_if_no_prices:
  statement: >-
    若冻结前仍无有来源价格：RQ2 只能报告“在所设情景价格下”的成本差，并同时给出与价格无关的量
    （例如同一可靠性下配方组成的变化、约束的影子价格结构）；不得宣称市场成本节约（合同 T2.2、T10）。
  status: "planned"
