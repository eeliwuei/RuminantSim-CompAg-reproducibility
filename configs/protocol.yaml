  endpoint: "joint_model_constraint_violation"
  cost_at_matched_verified_risk_required: true
  biological_outcomes_claimed: false
  membership_statistic: "cp_upper" # B2：one-sided exact Clopper–Pearson upper bound p̄ (c = 0.95) of the main event on the evaluation world's test stream ≤ α (D-533；B-126)
  target_met_rule: "p̄ ≤ α" # B2
  unknown_policy: "unknown states count as violations in rate_upper and p̄ (rate pair [r̂⁻, r̂⁺] reported)" # B2；B-126
  coverage_reported: ["per_entry", "per_distinct_ration"] # B2：members / entries attempted (no-ration entries in the denominator) and distinct member q_hash / distinct attempted q_hash (no-ration entries counted separately)
  empty_set_report: "per method: rate pair, p̄, target_met, minimum attainable main-event r̂⁺ over the declared grid with its cost (labelled not_a_comparable_cost), frontier diagnostic (m*/N bounds, frontier ration's main-event rates); frontier and diagnostics never enter a set" # B2；per_method_report.csv

