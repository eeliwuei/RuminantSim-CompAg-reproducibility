  hyperparameters_selected_on_test: false
  settings_file: "configs/methods.yaml (aligned to executed code, B-453) + experiments/E1_cost_reliability/official_v2.py OFFICIAL_SETTINGS" # B2
  screening_rule: {statistic: "cp_upper_le_alpha", confidence: 0.95, stream: "validation", counted_states: "n_V + n_U"} # B2；B-126；D-533
