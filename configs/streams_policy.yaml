# 随机流政策（streams policy）
# 编写：R3E_uncertainty_layers（项目记录），2026-09-25；依据第三轮复核执行指令 E.5 与复核报告 §9 第 5 条。
# 状态（合同 §2.3）：implemented（政策文件）；代码尚未读取本文件，没有代码层强制（见 reserved_formal_streams.enforcement）；frozen: false。
# 本文件只登记流的归属与预留，不抽取任何随机数；本轮没有使用下面预留的正式评估根。
# 用语：证据层级 code_tested / holder_verified / independently_reproduced / assumption_only / blocked；阶段状态沿用合同枚举。

schema: "ration_reliability.streams_policy/0.1"
file_role: "streams_policy"
created_on: "2026-09-25"
created_by: "R3E_uncertainty_layers (project note)"
stage_status: "implemented"
frozen: false
authority: >-
  随机流“属于开发资料还是正式评估”以本文件为准；configs/methods.yaml rng 与 configs/uncertainty.yaml sampling 只描述命名与隔离规则。
  configs/protocol.yaml splits.test_previously_seen 目前为 null（本任务无权修改 protocol.yaml）：按本文件，开发流的该项应为 true，
  由总负责人决定是否改写协议字段。
related_docs:
  data_layers: "docs/uncertainty_data_layers.md（数据层级与结论措辞；§6 摘要本文件）"

stream_mechanics:
  implementation: "src/ration_reliability/uncertainty/streams.py（RandomStreams）"
  seed_sequence: "numpy.random.SeedSequence(entropy = root_seed, spawn_key = (stream_index(name), *sub_keys))，生成器 PCG64"
  core_indices: {opt: 0, validation: 1, test: 2, outer: 3}
  named_index_rule: "其他流名的索引 = 2**32 + sha256(name) 前 4 字节（大端）；与创建顺序无关"
  stream_id_format: "root=<root_seed>/<name>[/<sub_key>...]（RandomStreams.stream_id；写入 DrawSet、SolveResult.streams_used 与运行记录）"
  note: "root_seed 或 spawn_key 不同的流互相独立；同一 root_seed、同一流名、同一子键 = 逐位相同的随机数"

principles:
  - id: "SP-1"
    rule: >-
      模拟抽样次数与随机种子不是统计单位。新随机流只降低同一声明分布下的 Monte Carlo 误差，不是新的真实数据：
      不增加饲料样品、牧场或动物证据，不能充当外部批次验证、留牧场验证或 E1–E5 外检。
  - id: "SP-2"
    rule: >-
      凡已被用于开发、诊断、选参、筛查、或已看过其结果的流，一律归“开发资料”（development_material）；
      不得在任何报告、稿件或状态页中称为“未接触的保留测试集 / hold-out”。
  - id: "SP-3"
    rule: >-
      正式评估只可使用 reserved_formal_streams 中的根，且须同时满足其 use_conditions；满足之前，任何代码、测试、脚本、
      smoke、--dry-run 或诊断都不得用这些根抽样。
  - id: "SP-4"
    rule: >-
      不得通过更换根、子键或抽样次数来挑选有利结果。正式根一经使用即写入运行记录，不再更换；若因实现缺陷必须重跑，
      沿用同一根，旧结果保留并如实披露。
  - id: "SP-5"
    rule: >-
      同一物理情景下各方法共用同一组 test 抽样（共同随机数，合同 T8.4）。不同母分布（H0、窄化 SD、C1 等）用同一根与同一流名，
      状态字节不要求相同，但须记录各世界的模型指纹与生成方式（执行指令 C.6）。

