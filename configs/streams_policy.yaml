    run_record.json 的 rng_streams；上列脚本源码。清单由 R3E 于 2026-09-25 读文件整理（code 与记录的静态核对，不是重跑）。

# ---------------------------------------------------------------------------------------------------------------
# 为将来正式评估预留的新根（本轮不得使用）
# ---------------------------------------------------------------------------------------------------------------
reserved_formal_streams:
  status: "reserved_not_used"
  reserved_on: "2026-09-25"
  used_in_this_round: false
  generation:
    method: "root_k = int.from_bytes(sha256(label_k 的 ASCII 字节).digest()[:8], 'big') >> 1（63 位，可放入 int64）"
    label_template: "ration_reliability_study/formal_evaluation/root/v1/k={k}"
    reproduce: >-
      python3 -c "import hashlib; print(int.from_bytes(hashlib.sha256(b'ration_reliability_study/formal_evaluation/root/v1/k=0').digest()[:8], 'big') >> 1)"
    why_fixed_now: >-
      在任何正式结果出现之前固定、与结果无关，防止事后挑种子；不从协议文件的哈希派生（否则改一下协议文字就能重抽一套流）。
      计算根值只用了 sha256，没有用这些根创建任何生成器或抽样。
  roots:
    - {k: 0, root_seed: 2970760983403232347, role: "正式评估主根"}
    - {k: 1, root_seed: 4113203358134278580, role: "种子重复 1（仅当冻结协议规定多根时使用）"}
    - {k: 2, root_seed: 9187226783059820865, role: "种子重复 2（同上）"}
  stream_names_under_formal_roots: >-
    沿用 RandomStreams 的核心名 opt / validation / test / outer，以及冻结协议登记的具名流与子键规则（例如信息价值先验与设计子流、
    H1 农场子键偏移）；具体子键表与抽样次数在冻结时写入协议，本文件不预设。
  uniqueness_check:
    date: "2026-09-25"
    method: >-
      在项目工作树全部文件（含 results/ 与 data/restricted_local/）中逐字搜索三个根的十进制串：写入本文件之前 0 处出现；
      与 src/、experiments/、scripts/、tests/ 中所有整数种子字面量比较：均不相同。今后除本文件外，根值只可出现在正式运行的记录中。
    evidence_status: "static_check_in_session（R3E 会话内执行的文本搜索，脚本未入库；不是 code_tested）"
  use_conditions:
    - "configs/protocol.yaml freeze.is_frozen = true，且冻结记录含代码清单哈希（合同 T6；执行指令 F.1）"
    - "run_type = official；运行前后有效代码与配置哈希相等，否则该运行降为调试（执行指令 F.1）"
    - >-
      方法、网格、选参规则、α、参考事件与适用域、分布族、相关结构与 SD 情景（含 docs/uncertainty_data_layers.md §5 的窄化范围与
      声明点）全部在冻结前固定；方法内部的校准只用正式根的 opt / validation，test 只做最终评估，不回流影响任何选择
    - "运行记录 rng_streams 写出正式根与全部流 id；流登记无碰撞（沿用 dev_case_v1 驱动的 StreamRegistry 规则）"
  forbidden_before_freeze: ["单元测试", "smoke", "--dry-run", "诊断或探索脚本", "筛查", "任何“先看一眼”"]
  enforcement:
    status: "not_enforced_in_code"
    note: >-
      本任务只写政策文件，没有改代码。建议另立任务：在 RandomStreams 或运行记录层对 run_type != official 或协议未冻结时拒绝
      reserved 根，并加回归测试（由总负责人分派）。
  what_new_streams_are_not: >-
    新随机流仍是同一营养模型、同一声明分布下的模拟：它只保证正式评估不与开发期已看过的抽样重叠，不提供新的饲料样品、牧场或
    动物数据，不构成外部验证，也不能把“给定模型/假设下的可靠性”升级为真实世界的可靠性。
