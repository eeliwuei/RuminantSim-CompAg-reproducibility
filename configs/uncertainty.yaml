        definition: >-
          两层结构（2026-09-24 按红队 high 发现改写）。同一外层世界里：
          (1) 本场均值 μ_farm ~ N(μ_P0, σ²_between)，由外层流 farm_mean 抽取；
          (2) 本批真实成分 θ | μ_farm ~ N(μ_farm, σ²_within)，由 test/validation 流抽取；
          σ²_within = (r·s·σ_P0)²（r 只用 true_only 比值，DC-03），σ²_between = (s·σ_P0)² − σ²_within（r < 1 时为正），
          使 θ 的边际分布仍是 P0（s 为维度 a 的 SD 缩放），H0 与 H1 在同一世界里比较。
          H0 决策者只知道 P0：先验 N(μ_P0, (s·σ_P0)²)，d̂ = μ_P0（DM）。
          H1 决策者知道本场历史：H1-perfect 变体已知 μ_farm；H1-m 变体只知 μ̂_farm = μ_farm + e，e ~ N(0, σ²_within/m_hist)，
          先验 N(μ̂_farm, σ²_within·(1 + 1/m_hist))，d̂ = μ̂_farm（DM）。
          两种信息状态用同一个 μ_farm 流与同一组 θ 抽样评估（共同随机数），差值才是“本场历史”的信息作用。
