          options: ["within_only", "between_only", "within_and_between"]
          note: >-
            FIX5（红队 medium 发现）：C1、C4、C_CONS 等候选描述的是群体层面的相关（C1 limitation 自己写明含农场间）。G2 原实现的农场间层
            对每个格单独抽均匀数（成分之间、原料之间永远独立），相关只进场内层；放进两层世界后边际相关被稀释到约 ρ·r_a·r_b
            （高斯尺度，information_states.two_layer_marginal_rho；合成例 ρ = −0.8、r = 0.5 时边际约 −0.2），IS-1（单层 copula）与
            IS-2（两层）在“同一相关情景”下其实是两个不同的联合世界。代码现要求给出相关结构时显式选 correlation_scope（无默认）；
            between_correlation 用高斯 copula 抽农场均值。同一 R 放两层且两成分 r 相同时边际相关等于 ρ，r 不同时略小。
            E3 选哪种、以及 IS-1 与 IS-2 是否可直接比较，由用户在 D-19 / D-10 决定；未定前 E3 须把两层世界的相关情景与 IS-1 分开报告。
        engine_truth_side_guard: >-
          FIX5（红队 medium 发现）：双计数防护原来只检查决策先验的口径。现 TwoLayerFarmModel.truth_sd_basis 声明生成真值 θ 所用 SD 的口径
          （默认 observed_incl_sampling_and_lab = P0 原样，DC-01；声明 true_batch_state 必须给 truth_sd_source）；
          assay_double_count_report(..., truth_model=...) 同时检查真值端，prior_deconvolved 声明只有在真值模型对该成分的生成 SD 为
          true_batch_state 时才被接受，否则判 violation。仍未解决（保持可见）：σ²_between 由差值得到，P0 SD 为观测口径时
          测量误差被整体吸收进农场间层，θ 的边际仍含测量误差（见 limitation）。
        engine_h1_m_history_error:
          value: null
          status: "pending_user_decision"
          decision_id: "D-FIX-5"
          note: >-
            H1-m 的历史均值误差 e ~ N(0, σ²_within/m_hist) 只用真实场内 SD，没有计入 m_hist 次历史化验本身的采样与实验室误差，
            系统性偏向 H1（红队 medium 发现）。是否计入、按什么误差参数计入，是 D-FIX-5 的一部分；代码在 DecisionPrior.notes 中标注。
        decision_id: "D-10"
    information_states_for_E3:
      - {id: "IS-0", name_zh: "只有成分表、边际汇总、成分独立", prior: "P0 + C0", decision_uses: "d̂ = P0 均值"}
      - {id: "IS-1", name_zh: "成分表 + 假设的联合结构", prior: "P0 + C1/C4/C5", decision_uses: "同 IS-0；机会约束方法使用联合抽样", caveat: "联合结构来自群体相关假设，不是真实联合记录（主约束成分没有公开的多成分行级数据）"}
      - {id: "IS-2", name_zh: "有本场历史", prior: "H1 两层结构：决策先验以 μ_farm（或 μ̂_farm）为中心、SD 为场内 SD", decision_uses: "d̂ = μ_farm 或 μ̂_farm（DM）；与 IS-0 在同一 μ_farm 流与同一 θ 抽样上比较", note: "旧写法“P0 均值 + H1 缩小 SD”已废止（见 H1_farm_history.replaced_definition）"}
      - {id: "IS-3", name_zh: "参考 DM 与更新 DM", prior: "同 IS-0/IS-2", decision_uses: "t2 取得所选原料 DM 检测（assays.yaml PANEL-DM）后更新该原料 d̂；其余不变", note: "只有购买 DM 检测的政策才可更新 d̂（合同 §6.3）"}
      - {id: "IS-4", name_zh: "当前批次多成分检测", prior: "同上", decision_uses: "t2 取得所选面板结果，按 assays.yaml 误差模型更新后验，在 t3 重新配方（合同 E4）"}
    missing_info_rule: "缺失成分不得填零；插补基于开发数据并增加不确定性或标记不可辨识（合同 §11 E3）"

  f_dm_channel:
    modes:
      - id: "DM-KNOWN"
        definition: "受控子模型：d_i(θ) ≡ d̂_i（DM 视为已知），只研究化学成分不确定性"
        status: "research_scenario_assumption"
        naming: "标题、方法、结果须写明这是受控简化，不得据此声称 DM 误差已解决（合同 T2）"
      - id: "DM-UNCERTAIN"
        definition: "d_i(θ) 随机；q 在 t3 按 d̂ 固定；评估时 x_real = q·d(θ)，不重新归一化"
        status: "research_scenario_assumption"
    primary: null
    primary_status: "pending_user_decision"
    dev_start_proposal: "DM-UNCERTAIN 为主，DM-KNOWN 为对照（数据可行性审计 §5.3-2：DM 通道必须进入可靠性评估）"
    protocol_field: "units_and_decisions.dry_matter_mode"

  g_mean_shift:
    meaning: "把 P0 均值按 ±k·SD 平移，检验“按表值配方”在均值错设时的违约；与 SD 放大分开报告"
    targets: ["CP", "Ca", "P"]
    k_grid: null
    k_grid_status: "pending_user_decision"
    k_grid_dev_start_proposal: [-1.0, -0.5, 0.5, 1.0]
    k_grid_dev_start_status: "research_scenario_assumption"
    k_grid_rationale: "幅度无文献直接给出，仅开发起点；方向依据见 motivation"
    engine_status: "implemented（scaling.mean_shift、build_scenario_targets；决策名义值不变；越出物理区间的格默认报错，或标记为 NaN，绝不截断到边界；单元测试 unit_passed）"
    engine_open_question:
      item: "平移所用的 SD 是 P0 的 σ 还是缩放后的 s·σ（代码参数 shift_sd_basis 必须显式给出，phase3 构建用 P0）"
      value: null
      status: "pending_user_decision"
      decision_id: "D-17"
    motivation:
      - "Kertz 1998：交付的谷物、油籽和副产品营养含量大多低于 NRC 值（S6§2.18，只读摘要）"
      - "Duplessis et al. 2024：NASEM 2021 玉米青贮矿物均值约相当于魁北克 9 场样品的第 99 百分位（S6§2.10）"
    decision_id: "D-17"

# ---------------------------------------------------------------------------
# U3：参数估计不确定性（外层重抽）
# ---------------------------------------------------------------------------
outer_parameter_draws:
  purpose: >-
    反映均值与 SD 本身的估计不确定性（U3）。印刷 N 较小（< 100）的单元（干甜菜粕 F14、麸皮、棉籽粕淀粉等，数据可行性审计 §2.2 要点 5）
    证据更弱，但印刷 N 不能换算成 U3 的样本量（见 problem_with_naive_n、forbidden_schemes）。
  problem_with_naive_n: >-
    NASEM Table 19-1 的 N 是四家商业实验室客户送检的记录数（印刷 p.360，pdf p.380），不是独立批次数：同一牧场多次送检构成伪重复，
    记录按牧场、实验室、年份聚类，并经 ±3.5 SD 与主成分得分截尾（印刷 p.361）。大宗原料的 N 在一万到五十多万之间，
    SD/√N 只有 SD 的约 1/100 到 1/730（reports/data_audit.md §7.2）；用 σ̂²/N 与 χ²_{N−1} 得到的 U3 区间约为 0，
    会把参数不确定性报成“几乎已知”，属于合同验收 E06 所说的聚类数据套独立模型（红队 B06、B10 与 low 发现）。
  forbidden_schemes:
    - id: "U3-NAIVE-PRINTED-N"
      definition: "μ* ~ N(μ̂, σ̂²/N)，σ*² ~ σ̂²·χ²_{N−1}/(N−1)，N 为 Table 19-1 印刷 N；以及任何按印刷 N 计算的 SD/√N 区间"
      status: "forbidden"
      forbidden_since: "2026-09-24（W1）"
      reason:
        - "SD/√n 描述的是均值估计误差，不是新批次的离散程度（合同 01 §7.4）；把它用作 U3 刻度的前提是 n 个样本独立同分布，这里不成立"
        - "印刷 N 是送检样本记录数，含同一牧场多次送检的伪重复和实验室、年份聚类，不代表独立批次；把它当样本量就是把技术重复当独立样本（验收 B10），也是聚类数据套独立模型（验收 E06）"
        - "由此得到的区间接近 0，混淆了“均值估得多准”与“参数本身有多不确定”，违反均值、SD、SE 口径区分（验收 B06）"
        - "与 reports/data_audit.md §7.2、§10 和 data/data_dictionary.md §5 第 9 条的禁令一致"
      scope_of_ban: "不得用于抽样、区间、图表、诊断输出或任何结果文件；方法部分只可引用 reports/data_audit.md §7.2 的量级说明来解释为什么禁止"
      replaced_history: "最初是 outer_parameter_draws 的唯一候选（红队 D 与 FIX_data 判 B10 配置层 FAIL）；FIX_docs 改名为 U3-NAIVE-DIAG（research_scenario_assumption，“只作诊断”）；W1 起一律禁止，诊断用途也不保留"
  scheme_candidates:   # 允许的替代；都没有选定，都不从印刷 N 推导样本量
    - id: "U3-NEFF"
      mean: "μ* ~ N(μ̂, σ̂²/n_eff)"
      sd: "σ*² ~ σ̂² · χ²_{n_eff−1}/(n_eff−1)"
      n_eff: null
      n_eff_status: "pending_user_decision"
      n_eff_decision_id: "D-FIX-6"
      n_eff_candidates_for_user: [4, 20]
      n_eff_candidates_basis: >-
        NASEM 2021 印刷 p.360（pdf p.380）：数据由 4 家商业实验室捐赠，2015 年春向每家索取了 5 年的数据 → 4 = 实验室数，
        20 = 实验室 × 年份数。正文没有写年份区间（“2011–2015”只见于调研对 Tran 2020 的转述，本项目未核原文）。
        把实验室或“实验室 × 年份”当作独立单元是研究情景假设（相当于把组内相关视为 1 的设计效应），不是估计值；取哪个值须用户定。
      constraints: >-
        n_eff 须 ≥ 2（χ² 自由度至少 1）且不大于该单元的印刷 N（有效样本量不会超过记录数）；
        各单元实际来自几家实验室、几年，印刷表没有给出，同一个 n_eff 用于所有原料 × 成分本身也是假设，须在方法中写明
      status: "pending_user_decision"
      reporting_as: "有效样本量假设下的样本区间，必须注明 n_eff；不得称为 NASEM 数据的置信区间"
    - id: "U3-OUTER-SCENARIO"
      definition: >-
        外层参数情景：不从任何 N 推导，直接把 (μ, σ) 设为预登记的有限组合，每个组合跑一次完整评估。
        可直接沿用维度 a（SD 缩放 s）与维度 g（均值平移 k·SD）的网格；若沿用，U3 与维度 a、g 合并报告，不重复计数
      grid: null
      grid_status: "pending_user_decision"
      decision_id: "D-FIX-6（与 D-17 一起定）"
      status: "pending_user_decision"
      reporting_as: "假设范围（合同 T8.3），不称样本区间或置信区间"
    - id: "U3-LINEAGE"
      definition: "用不同谱系（C 与取得许可并复核后的 A、B）之间的均值/SD 差异作为参数不确定性的范围"
      status: "blocked"
      blocked_by: "P0-9 许可 + P2-2 原始导出复核（A、B 数值目前未核）"
      reporting_as: "假设范围（不称样本区间）"
  fallback_rule: "若用户就 D-FIX-6 既不接受 U3-NEFF 也不接受 U3-OUTER-SCENARIO，且 U3-LINEAGE 仍 blocked，则在报告中声明“U3 不可识别”，只报告假设范围，不给样本区间（合同 T8.3）"
  primary: null
  primary_status: "pending_user_decision"
  decision_id: "D-FIX-6"
  status: "pending_user_decision"
  n_outer: null
  n_outer_status: "pending_user_decision"
  reporting: "U3-NEFF 结果标注“有效样本量假设下的样本区间（n_eff = 用户所定值）”；U3-OUTER-SCENARIO、U3-LINEAGE 只称假设范围；三者都与 MC 区间分开报告（合同 T8.3）"

# ---------------------------------------------------------------------------
# 双计数防护（合同 §7.3 末段、T7.5；验收 F06、F07）
# ---------------------------------------------------------------------------
double_counting_guards:
  - id: "DC-01"
    rule: "P0 的 SD 来自历史实验室结果，已含历史采样与分析误差。生成“真实批次成分 θ”时不得再加检测噪声"
  - id: "DC-02"
    rule: >-
      在 E4 中需要“潜在真值”先验时，令 τ² = (s·σ_P0)² − σ²_sampling,hist − σ²_lab,hist；若 τ² ≤ 0 记为不可辨识，
      不截断成正数后继续。σ_*,hist 的来源与 assays.yaml 同源并逐项标注；缺乏识别数据时只报告情景范围（T7.5）
    status: "research_scenario_assumption"
  - id: "DC-03"
    rule: "H1 本场历史状态只能用 true_only 比值生成 θ；observed/residual 比值只用于核对，不与检测误差叠加"
    engine_status: "implemented（TwoLayerFarmModel 拒绝非 true_only 比值；information_states.assay_double_count_report / require_no_double_count 调用 information.signal.double_count_guard；H0 先验按 DC-01 记为 observed_incl_sampling_and_lab）"
  - id: "DC-04"
    rule: "同一研磨样本重复化验只缩小实验室重复性误差（1/√k），不缩小采样误差、实验室偏差或未来批次变异"
  - id: "DC-05"
    rule: "检测当前批次不会使未来批次波动变为零；结果只在有效期内作用于该批/该窖（合同 T1；数据可行性审计 §4.5）"
  - id: "DC-06"
    rule: "装料误差是独立误差源，不与检测价值混在一起；本研究主分析不建模装料误差，须在局限中写明（S6§2.20）"

# ---------------------------------------------------------------------------
# 抽样与随机流（具体规模见 configs/methods.yaml）
# ---------------------------------------------------------------------------
sampling:
  draws_are_not_samples: "模拟次数只降低 MC 误差，不增加真实证据；随机种子不是统计单位（数据可行性审计 §0 Q2-1）"
  stream_names: ["optimisation", "validation", "test", "outer_parameter", "assay_signal", "policy_evaluation", "farm_mean"]
  stream_isolation: "numpy SeedSequence(master_seed).spawn 按名称固定顺序生成子流；见 methods.yaml rng"
  engine_stream_names: >-
    代码中的名称（uncertainty/streams.py）：optimisation → opt（索引 0）、validation（1）、test（2）、outer_parameter → outer（3）；
    其余名称（assay_signal、farm_mean、farm_history、phase3_moment_check 等）由名称 sha256 派生索引（≥ 2³²），与创建顺序无关。
    G2 抽样有效性核验与 MC 标准误规则见 reports/stage3_data_processing.md §6（开发期小规模核验，不是实验）。
  common_random_numbers: "同一物理情景下所有方法共用同一组测试抽样（合同 T8.4 配对比较）"
  stream_policy_round3: >-
    configs/streams_policy.yaml（R3E，2026-09-25）：现有全部 opt / validation / test 流（根 1103 全部子流，及 2207、3301、1000–1399）
    统归开发资料；为正式评估预留的新根本轮不得使用；新随机流仍不是新真实数据
  ingredient_order_invariance: "重排原料/情景顺序不得改变物理结果（合同 §8 必需测试）"
