# 不确定性模型（uncertainty）——draft，未冻结
# 生成：P2b_constraints_units 子任务，2026-09-24
# 状态（合同 §2.3）：implemented（结构已起草，draft）；未被代码读取；未冻结；主假设未选。
# 研究层级：第二层（route_decision：summary_based_computation）——“在声明的分布族 𝒫 与固定版本营养模型下的
#   计算可靠性分析”；从均值/SD 生成的样本是模拟抽样，不是真实样本（数据可行性审计 §0 Q2-1）。
# 规则：
#   - 四类不确定性分开建模、分开报告，不合成一个无单位风险分数（合同 §7.3）。
#   - 没有来源的参数写 null，并标 pending_user_decision 或 research_scenario_assumption（写明理由）。
#   - NASEM Table 19-1 的均值/SD/N 只在 data/restricted_local/，本文件只写引用路径。
# G2_phase3_uncertainty（2026-09-24）追加：各候选下新增 engine_* 字段（代码实现状态与指针），另新增候选 TN_MM、BETA_MM、
#   C_CONS_closure；scripts/build_phase3_tables.py 读取本文件的 SD 缩放网格、k 开发起点、C1 成对键、C5 网格与 ratio_table。
#   没有改动任何 pending_user_decision 项、primary 字段或数值；frozen 仍为 false。
# R3E_uncertainty_layers（2026-09-25，第三轮复核执行指令 E）只追加元数据字段（键名以 _round3 结尾）：数据层级标签、逐格比值登记表指针、
#   窄化 SD 敏感性范围指针、随机流政策指针。没有改动任何数值、网格、候选、primary、pending 项或既有选择；frozen 仍为 false。

