# ---------------------------------------------------------------------------
# 四类不确定性（合同 01 §7.3；02 T7.5、T8.3）
# ---------------------------------------------------------------------------
uncertainty_categories:
  U1_batch_true_variation:
    meaning: "批次间真实成分变异：决定情景 θ 中的 d_i(θ)、a_ij(θ)"
    modelled_by: "base_distribution + 本文件各敏感性维度"
    in_primary_analysis: true
  U2_current_batch_observation_error:
    meaning: "当前批次的采样误差、实验室随机误差与系统偏差：只在有检测动作的信息政策里出现"
    modelled_by: "configs/assays.yaml（Z = θ + ε_sampling + ε_lab + b）"
    in_primary_analysis: "只在合同 E4（信息价值）与 E3 的“检测后”信息状态中"
  U3_parameter_estimation:
    meaning: "分布参数（均值、SD、相关）本身的估计不确定性"
    modelled_by: "outer_parameter_draws（外层重抽或外层参数情景；按印刷 N 构造的朴素形式禁止，见 outer_parameter_draws.forbidden_schemes）"
    in_primary_analysis: false
    reporting: "单独报告，不与 MC 误差、假设范围混成一个区间（合同 T8.3）"
  U4_model_and_standard:
    meaning: "营养模型/标准适用性：AC 取值、Table 5-1 前提、DMI 方程版本、需要量为 EAR 等"
    modelled_by: "预登记敏感性（constraints.yaml 的选项；E5）"
    in_primary_analysis: false

# ---------------------------------------------------------------------------
# 基准分布 P0（谱系 C：NASEM 2021 Table 19-1）
# ---------------------------------------------------------------------------
base_distribution:
  id: "P0_NASEM2021_T19_1"
  lineage_id: "C"
  parameter_file: "data/restricted_local/nasem_t19_1_core.csv（核心表 v2，A、B 双录入对账后生成；283 行 × 33 列；不进 git）"
  parameter_file_sha256: "6c732510b563c5e1f6bbe9c9f82dfd678a9e02763ca6df4ea4b8ee2731bd2fdd"
  parameter_file_hash_record: "reports/data_audit.md（§1 输入与输出哈希表；§11.2 第 2 项）"
  parameter_file_status: >-
    核心表 v2 implemented；283 行中 both_agree 278、resolved 5、unresolved 0；278 个双录入一致单元的转录为 independently_checked，
    限定：两次录入都由 软件辅助录入 完成，不是人类双录入（reports/data_audit.md §0、§9）
  parameter_file_rules: >-
    只用 entry_agreement ∈ {both_agree, resolved} 的行；离散度只取 statistic_type = summary_mean_sd_n 的单元；
    按核心表 concept_id 连接并对多条目概念显式选 nasem_feed_id（data/data_dictionary.md §3.2、§5 第 10–11 条）
  parameter_file_superseded: "2026-09-24 前指向 data/restricted_local/nasem_t19_1_entry_A.csv（A 单录入）——已废止（红队 D B08/B10；BLOCKERS B-132；W1）"
  statistics_available: ["mean", "sd", "n"]
  statistics_not_available: ["min", "max", "P10", "P90（正文称新增，但印刷表未列，NASEM p.361）", "相关/协方差矩阵"]
  sd_semantics: >-
    出处逐条分开（2026-09-24 W1 对照 PDF 原文改正；此前把第 (1) 条误引为 NASEM p.361）：
    (1) “SD 为各实验室内 SD 按样本数加权的线性平均”只来自调研 S1§2.6 对 Tran et al. 2020 的转述，本项目没有原文
    （sources/source_registry.csv SRC-C-TRAN2020 为 not_downloaded；核心表 sd_definition 带 _secondary_unverified），属二手、未核实。
    NASEM 2021 第 19 章正文（印刷 p.360–361，pdf p.380–381）没有写 SD 怎样跨实验室合成，不能作为这一条的出处。
    (2) 截尾与亚群：关键成分超出均值 ± 3.5 SD 的样本被删除，主成分得分超过 3.5 SD 的样本被删除，再用聚类识别亚群
    （NASEM 印刷 p.361，pdf p.381）。
    (3) 湿化学与近红外数据无法区分、两者都用（印刷 p.360–361，pdf p.380–381）；矿物只来自湿化学（印刷 p.361）。
    因此它相对于美国送检群体可能偏小（第 (2) 条；第 (1) 条若成立也同向）、相对于单个牧场的批次变异偏大，
    方向依决策情景而定（数据可行性审计 §11.1-1；reports/data_audit.md §7）。
  sd_is_not_se: >-
    SD 描述新批次的离散程度；SD/√n 是均值的估计误差（标准误），不是新批次波动，不得当作新批次波动（合同 01 §7.4）。
    用 Table 19-1 印刷 N 计算的 SD/√N、σ̂²/N 及其区间在本项目的任何用途中都禁止（包括 U3，也包括“只作诊断”），
    见 outer_parameter_draws.forbidden_schemes；U3 只允许 outer_parameter_draws.scheme_candidates 中的形式，
    其中有效样本量须由用户按 D-FIX-6 决定（2026-09-24 W1 改；此前写作“只用于 U3”）。
  data_layer_round3:          # R3E（2026-09-25）追加的元数据；不改上面任何数值或规则
    layer_id: "H0"
    variance_basis: "observed_incl_sampling_and_lab"
    used_as: "当前批次（本批）成分的真实波动"
    assumption_strength: "strong_assumption"
    is_real_world_baseline: false
    evidence_status_of_this_use: "assumption_only"
    note: >-
      把送检结果的观测总 SD（含历史采样与分析误差、跨牧场与跨实验室变异）当作本批波动，是强假设，不是“真实世界基线”；
      相对单个牧场的批次变异它可能偏大，相对美国送检总体它可能偏小（见 sd_semantics），方向依情景而定。
      可支持与不可支持的结论措辞见 docs/uncertainty_data_layers.md。
  stochastic_ingredients: "inventories.yaml 中 role 为 core_stochastic / core_stochastic_candidate 的 15 种"
  deterministic_ingredients: "脂肪粉（F25 点值）、石粉、磷酸氢钙、食盐、小苏打、预混料（待定）"
  stochastic_nutrients: ["DM", "CP", "NDF", "starch", "EE", "Ca", "P"]
  derived_nutrients: {fNDF: "forage_flag × NDF（同一次抽样的 NDF）", Ca_abs: "AC 固定", P_abs: "AC 固定"}
  missing_value_policy:
    rule: "均值缺失的原料 × 成分：不补零（nutrients.yaml NR-03）"
    options:
      - "该原料在涉及此成分的约束中不可用（从可用集合移出并记录）"
      - "借用同类原料 CV（research_scenario_assumption，逐格标“借用”）"
    chosen: null
    status: "pending_user_decision"
  point_value_policy:
    rule: "有均值无 SD/N（单一来源点值，如多数 TFA 估算值）：不生成随机抽样"
    options:
      - "作为确定性值并记 DQF-SINGLE-SOURCE"
      - "借用同类 CV（research_scenario_assumption）"
    chosen: null
    status: "pending_user_decision"
  mean_equals_reference: "t0 的名义值（M0 使用、决策时的 d̂）= P0 的均值；不用 AFZ/CVB 等其他谱系的均值（它们只在来源情景中出现）"

# ---------------------------------------------------------------------------
# 预登记敏感性维度 (a)–(g)（数据可行性审计 §0 Q2-3）
# ---------------------------------------------------------------------------
sensitivity_dimensions:

  a_sd_scale_factor:
    meaning: "把 P0 的 SD 整体乘以因子 s（所有随机原料 × 成分同乘，或按原料类分组）"
    must_cover_both_directions: true
    must_cover_source: "数据可行性审计 §0 Q2-3(a)、§11.1-1：NASEM SD 同时存在偏小（截尾、实验室内 SD 平均）与偏大（方法混用）的机制"
    grid: [0.667, 0.8, 1.0, 1.25, 1.5]
    grid_status: "research_scenario_assumption"
    engine_status: "implemented"
    engine_impl: "src/ration_reliability/uncertainty/scaling.py（scale_sd、scale_sd_by_group、build_scenario_targets）；单元测试 unit_passed（tests/unit/test_uncertainty_scaling.py）"
    engine_note: "是否同乘 DM 的 SD 须显式给出（sd_scale_applies_to_dm，无默认）；缩放后逐格重新矩匹配，TN 不可匹配的格如实标记（reports/stage3_data_processing.md §3）"
    grid_rationale: >-
      对数尺度上以 1 为中心对称（×/÷1.25、×/÷1.5），覆盖 <1 与 >1 两个方向；幅度本身没有文献依据，
      只是开发起点。与维度 (e) 的“本场历史”比值 r 是不同概念：s 缩放总 SD；r 只把（缩放后的）总方差分成场间与场内两部分（H1 两层结构），不是再缩小一次。
    relation_to_narrowed_range_round3: >-
      R3E（2026-09-25）追加：窄化 SD 敏感性范围（docs/uncertainty_data_layers.md §5，逐格场内比值 ≤ 1）与本维度分开报告；
      两者不叠加使用（窄化点再乘 s < 1 属于继续降低 SD，超出声明范围）。
    decision_id: "D-17"

  b_distribution_family:
    candidates:
      - id: "TN"
        name: "截断正态"
        definition: "N(μ, (s·σ)²) 截断到物理区间：%DM 成分 [0, 100]；DM [0, 100] % as-fed；若 Σ 截断质量 > 1% 须报告均值偏移"
        status: "research_scenario_assumption"
        engine_status: "implemented"
        engine_impl: "distributions.naive_truncnorm（族名 TN_NAIVE，只作诊断：均值漂移；smoke 的 20/119 由 scripts/build_phase3_tables.py 复现）"
      - id: "TN_MM"
        name: "截断正态（矩匹配）"
        definition: "父正态 (μ*, σ*) 由数值求解，使截断到物理区间后的均值、SD 恰等于目标 (μ, s·σ)；CV（相对下界）≥ 1 的格数学上不可能，标 not_matchable，不强行拟合"
        status: "research_scenario_assumption"
        engine_status: "implemented"
        engine_impl: "src/ration_reliability/uncertainty/distributions.py fit_truncnorm_moments；单元测试 unit_passed（tests/unit/test_uncertainty_distributions.py）"
        added_by: "G2_phase3_uncertainty（2026-09-24），用于解决 smoke S-5 的均值漂移"
      - id: "LN"
        name: "对数正态（矩匹配）"
        definition: "按 μ、σ 矩匹配；只用于非负成分；上界 100 另做截断"
        status: "research_scenario_assumption"
        engine_status: "implemented"
        engine_impl: "distributions.fit_lognormal_moments（族名 LN_MM）：抽样总在上界截断；截断后的矩不等于目标时数值求解截断对数正态，使截断后的均值、SD 仍等于目标"
      - id: "BETA_MM"
        name: "Beta（有界成分，矩匹配）"
        definition: "lower + (upper − lower)·Beta(a, b)，a、b 由均值、SD 闭式求出；a < 1 或 b < 1 时密度在边界无界，逐格标记"
        status: "research_scenario_assumption"
        engine_status: "implemented"
        engine_impl: "distributions.fit_beta_moments；单元测试 unit_passed"
        added_by: "G2_phase3_uncertainty（2026-09-24）"
      - id: "N"
        name: "未截断正态"
        definition: "只作诊断（可能出现负值），不作主分析"
        status: "research_scenario_assumption"
        engine_status: "implemented"
        engine_impl: "distributions.untruncated_normal（族名 N_UNTRUNCATED，只报告物理区间外的概率质量，不可抽样）"
      - id: "EMP"
        name: "经验分位数"
        definition: "只有在取得有许可的分位数（NANP P10/P90：P0-4；Dairy One：P0-2/P0-3）后才可用"
        status: "blocked"
    note: "NASEM 提示部分营养素不服从正态、均值未必是最佳中心（p.360–361）"
    primary: null
    primary_status: "pending_user_decision"
    dev_start_proposal: "TN（开发起点，未选定）"
    decision_id: "D-19"

  c_correlation_structure:
    scope_note: "相关只在同一原料的成分之间有文献依据（Yoder 2014 群体相关）；场内批次间相关、不同原料之间的相关均无公开数据（数据可行性审计 §4.4）"
    candidates:
      - id: "C0_independent"
        definition: "所有成分、所有原料相互独立"
        status: "research_scenario_assumption"
        role: "基线，不是事实（合同 §7.4）"
        engine_status: "implemented"
        engine_impl: "correlation.independent_structure；GaussianCopulaModel 在 R = I 时与独立抽样逐位相同（共同随机数）"
      - id: "C1_yoder_table6"
        definition: >-
          用 Yoder et al. 2014 表 6 过滤后的群体相关（只覆盖 4 对成分 × 9 种原料），其余对取 0；
          只作用于随机成分集合 base_distribution.stochastic_nutrients（DM、CP、NDF、starch、EE、Ca、P）。
          下列 values_used 中涉及 lignin、ash 的对（玉米青贮 NDF_lignin、ash_NDF）不进入抽样矩阵（lignin、ash 不是随机成分）；
          若以后把 lignin 或 ash 改为随机成分，“其余对取 0”的矩阵不是半正定（见 psd_precheck_20260924），
          须另行给出隐含相关（例如 PSD 补全）并重新预检，不得直接使用。
        scope_restriction_reason: "红队 B09：C1 全部 5 个成分（NDF/淀粉/CP/灰分/木质素）的最小特征值为 ⟨withheld⟩，NDF/淀粉/木质素为 ⟨withheld⟩；限定在随机成分子集后为 ⟨withheld⟩"
        values_used:
          corn_silage: {starch_NDF: null, NDF_lignin: null, CP_NDF: null, ash_NDF: null, value_ref: "withheld (public copy): Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, Table 6 (redistribution licence undecided, B-310)"}
          legume_silage_mid: {CP_NDF: null, note: "Yoder 为苜蓿青贮，映射到 F95 为近似", value_ref: "withheld (public copy): Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, Table 6 (redistribution licence undecided, B-310)"}
          cool_season_grass_hay_mid: {CP_NDF: null, note: "Yoder 为禾草干草（不分冷暖季）", value_ref: "withheld (public copy): Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, Table 6 (redistribution licence undecided, B-310)"}
          cottonseed_whole_linted: {CP_NDF: null, starch_NDF: null, value_ref: "withheld (public copy): Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, Table 6 (redistribution licence undecided, B-310)"}
          canola_meal: {CP_NDF: null, note: "接近 0，不当作有相关证据（数据可行性审计 §4.4）", value_ref: "withheld (public copy): Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, Table 6 (redistribution licence undecided, B-310)"}
          ddgs: {CP_NDF: null, note: "酒糟；过滤后接近 0；酒糟 NDF 方法亚群问题见 S6§2.16", value_ref: "withheld (public copy): Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, Table 6 (redistribution licence undecided, B-310)"}
        source: "Yoder, St-Pierre & Weiss 2014, J Dairy Sci 97:5645, doi:10.3168/jds.2013-7724, 表 6（经 S6§2.16 转录）"
        limitation: "群体层面（含农场间、实验室、成熟度亚群），不是场内批次相关；不含 Ca、P、ADF；DM 与其他成分的相关在补充表中，未下载"
        status: "pending_user_decision"
        status_superseded: "sourced（2026-09-24 FIX5 前的值）"
        status_reason: >-
          FIX5（红队 low 发现：配置与代码口径矛盾）：S6 §2.16 把表 6 数值标为【原文】，但只给了文章页码范围 5645–5656，
          没有表 6 所在页；代码侧登记表按“只用带页码的数值”全部置 null。两处统一为 pending_user_decision，
          直到用户二选一：核对表 6 页码（或批准下载补充材料 P0-6）后填入代码侧登记表；或确认“文章页码范围”作为定位已足够。
          下列 values_used 原样保留，只作待核对的转录，不是已核实来源。
        engine_status: "implemented（机制：correlation.pairwise_structure；值为 None 时抛 PendingValueError，不当 0）"
        engine_values_status: "pending_user_decision"
        engine_values_note: >-
          G2 任务规则：只用调研笔记 S6 中带页码的数值。S6 §2.16 只给了表号（表 6）与文章页码范围 5645–5656，没有表 6 所在页，
          因此代码侧登记表 data/restricted_local/processed/phase3_yoder_c1_registry.csv 中 11 个成对值全部为 null，C1（及依赖它的 C4）
          在 phase3 构建中未构造。上面 values_used 保持原样未改；须由用户核对页码（或批准下载补充材料 P0-6）后再填入代码侧登记表。
      - id: "C2_yoder_full"
        definition: "Yoder 2014 补充表的完整矩阵"
        status: "blocked"
        blocked_by: "P0-6（补充材料需用户在浏览器手动下载）"
      - id: "C3_rowlevel_corn_silage"
        definition: "由 PLOS ONE 2024 巴西玉米青贮 94 个样本估计的相关（报告置信区间）"
        status: "blocked"
        blocked_by: "P1-5 ②（批准下载 S1 文件）"
      - id: "C4_extreme"
